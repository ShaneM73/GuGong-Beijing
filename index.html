\u306B\u7528\u3044\u3089\u308C\u305F\u3002","\uD669\uC81C\uAC00 \uCE5C\uACBD\uD55C \uC801\uC804\uC758 \uACE1\uC2DD\uC744 \uC800\uC7A5\uD558\uB358 \uC6D0\uB77D\uC73C\uB85C \uAC00\uC6B4\uB370 \uB465\uADFC \uCC3D\uACE0\uAC00 \uC788\uB2E4. \uC800\uC7A5\uD55C \uACE1\uC2DD\uC740 \uB3C4\uC131 \uC5EC\uB7EC \uB2E8\uBB18\uC758 \uC81C\uC0AC\uC5D0 \uC4F0\uC600\uB2E4."],"\u89C2\u8015\u53F0 \xB7 \u4E00\u4EA9\u4E09\u5206\u5730":['Each mid-spring the emperor ploughed the sacred field south of the platform, the "one mu and three fen" plot, then mounted the platform to watch princes and ministers plough.',"\u6BCE\u5E74\u4EF2\u6625\u3001\u7687\u5E1D\u306F\u53F0\u306E\u5357\u306E\u7C4D\u7530\u300C\u4E00\u755D\u4E09\u5206\u5730\u300D\u3067\u92E4\u3092\u53D6\u3063\u3066\u89AA\u8015\u3057\u3001\u793C\u304C\u7D42\u308F\u308B\u3068\u53F0\u306B\u767B\u3063\u3066\u738B\u516C\u5927\u81E3\u306E\u8015\u4F5C\u3092\u89B3\u305F\u3002",'\uD574\uB9C8\uB2E4 \uBD04 \uD55C\uAC00\uC6B4\uB370\uC5D0 \uD669\uC81C\uAC00 \uB300 \uB0A8\uCABD\uC758 \uC801\uC804 "\uC77C\uBB34\uC0BC\uBD84\uC9C0"\uC5D0\uC11C \uC7C1\uAE30\uB97C \uC7A1\uC544 \uCE5C\uACBD\uD558\uACE0, \uC608\uAC00 \uB05D\uB098\uBA74 \uB300\uC5D0 \uC62C\uB77C \uC655\uACF5 \uB300\uC2E0\uB4E4\uC774 \uBC2D\uAC00\uB294 \uAC83\uC744 \uC9C0\uCF1C\uBCF4\uC558\uB2E4.'],\u5177\u670D\u6BBF:["Where the emperor changed into ritual dress before ploughing.","\u7687\u5E1D\u304C\u89AA\u8015\u306E\u524D\u306B\u793C\u670D\u3092\u7740\u66FF\u3048\u305F\u5834\u6240\u3002","\uD669\uC81C\uAC00 \uCE5C\uACBD \uC804\uC5D0 \uC608\uBCF5\uC744 \uAC08\uC544\uC785\uB358 \uACF3\uC774\uB2E4."],\u5E86\u6210\u5BAB:["Built in the Tianshun era of the Ming, first as a fasting palace; in the Qing the emperor held a celebration here after the ploughing rite and rewarded his officials.","\u660E\u306E\u5929\u9806\u5E74\u9593\u306B\u5EFA\u3066\u3089\u308C\u3001\u521D\u3081\u306F\u658E\u5BAE\u3067\u3042\u3063\u305F\u3002\u6E05\u4EE3\u306B\u306F\u89AA\u8015\u306E\u793C\u304C\u7D42\u308F\u3063\u305F\u5F8C\u3001\u7687\u5E1D\u304C\u6176\u8CC0\u306E\u793C\u3092\u884C\u3044\u767E\u5B98\u3092\u306D\u304E\u3089\u3046\u5834\u3068\u306A\u3063\u305F\u3002","\uBA85\uB098\uB77C \uCC9C\uC21C \uC5F0\uAC04\uC5D0 \uC9C0\uC5B4 \uCC98\uC74C\uC5D0\uB294 \uC7AC\uAD81\uC774\uC5C8\uB2E4. \uCCAD\uB098\uB77C \uB54C\uB294 \uCE5C\uACBD\uB840\uB97C \uB9C8\uCE5C \uB4A4 \uD669\uC81C\uAC00 \uACBD\uD558\uB840\uB97C \uD589\uD558\uACE0 \uBC31\uAD00\uC744 \uC704\uB85C\uD558\uB358 \uACF3\uC774 \uB418\uC5C8\uB2E4."],\u5929\u795E\u5730\u7947\u575B:["Two square altars for the gods of wind, cloud, thunder and rain and of mountains, seas and rivers. Only parts survive; their positions are marked here.","\u98A8\u96F2\u96F7\u96E8\u30FB\u5C71\u5CB3\u6D77\u7006\u306E\u8AF8\u795E\u3092\u7940\u308B\u4E8C\u3064\u306E\u65B9\u58C7\u3002\u73FE\u5728\u306F\u4E00\u90E8\u306E\u907A\u69CB\u306E\u307F\u304C\u6B8B\u308A\u3001\u3053\u3053\u3067\u306F\u4F4D\u7F6E\u3092\u793A\u3059\u3002","\uBC14\uB78C\xB7\uAD6C\uB984\xB7\uC6B0\uB808\xB7\uBE44\uC640 \uC0B0\uC545\xB7\uBC14\uB2E4\xB7\uAC15\uC758 \uC2E0\uB4E4\uC744 \uBAA8\uC2E0 \uB124\uBAA8 \uC81C\uB2E8 \uB458\uC774\uB2E4. \uC9C0\uAE08\uC740 \uC77C\uBD80 \uC720\uC801\uB9CC \uB0A8\uC544 \uC5EC\uAE30\uC11C\uB294 \uC704\uCE58\uB9CC \uD45C\uC2DC\uD588\uB2E4."],\u5148\u519C\u575B:["Where Ming and Qing emperors sacrificed to the god of agriculture and performed the ploughing rite, symmetrical with the Temple of Heaven. The Taisui Hall courtyard, divine kitchen, granary, ploughing platform and Qingcheng Palace survive; a stadium and housing were later built in the outer precinct, which is shown here only as woodland.","\u660E\u6E05\u306E\u7687\u5E1D\u304C\u5148\u8FB2\u3092\u7940\u308A\u89AA\u8015\u306E\u793C\u3092\u884C\u3063\u305F\u5834\u6240\u3067\u3001\u5929\u58C7\u3068\u6771\u897F\u5BFE\u79F0\u3002\u592A\u6B73\u6BBF\u306E\u9662\u843D\u3001\u795E\u53A8\u3001\u795E\u5009\u3001\u89B3\u8015\u53F0\u3001\u6176\u6210\u5BAE\u306A\u3069\u304C\u6B8B\u308B\u3002\u5916\u58C7\u306B\u306F\u5F8C\u306B\u7AF6\u6280\u5834\u3084\u4F4F\u5B85\u304C\u5EFA\u3066\u3089\u308C\u3001\u3053\u3053\u3067\u306F\u5916\u58C7\u3092\u6797\u3067\u793A\u3059\u306E\u307F\u3002","\uBA85\xB7\uCCAD \uD669\uC81C\uAC00 \uC120\uB18D\uC5D0 \uC81C\uC0AC \uC9C0\uB0B4\uACE0 \uCE5C\uACBD\uB840\uB97C \uD589\uD558\uB358 \uACF3\uC73C\uB85C \uCC9C\uB2E8\uACFC \uB3D9\uC11C \uB300\uCE6D\uC744 \uC774\uB8EC\uB2E4. \uD0DC\uC138\uC804 \uC6D0\uB77D, \uC2E0\uC8FC, \uC2E0\uCC3D, \uAD00\uACBD\uB300, \uACBD\uC131\uAD81 \uB4F1\uC774 \uB0A8\uC544 \uC788\uB2E4. \uC678\uB2E8\uC5D0\uB294 \uB4A4\uC5D0 \uACBD\uAE30\uC7A5\uACFC \uC8FC\uD0DD\uC774 \uB4E4\uC5B4\uC130\uC73C\uBA70, \uC5EC\uAE30\uC11C\uB294 \uC678\uB2E8\uC744 \uC232\uC73C\uB85C\uB9CC \uB098\uD0C0\uB0C8\uB2E4."],\u5929\u6865:[`The stone bridge Ming and Qing emperors crossed on their way to the Temple of Heaven and the Altar of Agriculture, hence "Heavenly Bridge". The original was removed in 1934; today's is a landscape bridge rebuilt from historical records, slightly moved.`,"\u660E\u6E05\u306E\u7687\u5E1D\u304C\u5929\u58C7\u3084\u5148\u8FB2\u58C7\u3078\u796D\u7940\u306B\u8D74\u304F\u969B\u306B\u6E21\u3063\u305F\u77F3\u6A4B\u3067\u3001\u3086\u3048\u306B\u300C\u5929\u6A4B\u300D\u3068\u547C\u3070\u308C\u308B\u3002\u5143\u306E\u6A4B\u306F1934\u5E74\u306B\u64A4\u53BB\u3055\u308C\u3001\u73FE\u5728\u306E\u3082\u306E\u306F\u53F2\u6599\u306B\u57FA\u3065\u304D\u5FA9\u5143\u3055\u308C\u305F\u666F\u89B3\u6A4B\u3067\u3001\u4F4D\u7F6E\u304C\u3084\u3084\u7570\u306A\u308B\u3002",'\uBA85\xB7\uCCAD \uD669\uC81C\uAC00 \uCC9C\uB2E8\uACFC \uC120\uB18D\uB2E8\uC5D0 \uC81C\uC0AC\uD558\uB7EC \uAC08 \uB54C \uAC74\uB108\uB358 \uB3CC\uB2E4\uB9AC\uB77C "\uCC9C\uAD50"\uB77C \uD588\uB2E4. \uC6D0\uB798 \uB2E4\uB9AC\uB294 1934\uB144\uC5D0 \uCCA0\uAC70\uB418\uC5C8\uACE0, \uC9C0\uAE08 \uAC83\uC740 \uC0AC\uB8CC\uC5D0 \uB530\uB77C \uBCF5\uC6D0\uD55C \uACBD\uAD00 \uB2E4\uB9AC\uB85C \uC704\uCE58\uAC00 \uC870\uAE08 \uB2E4\uB974\uB2E4.'],\u5357\u6BB5\u9053\u8DEF\u9057\u5B58:["The Ming and Qing imperial road from Yongdingmen to Zhengyangmen. Excavations found road surfaces and drains of different periods stacked on one another, showing the road has kept the same line for centuries.","\u660E\u6E05\u671F\u306B\u6C38\u5B9A\u9580\u304B\u3089\u6B63\u967D\u9580\u3078\u901A\u3058\u305F\u5FA1\u9053\u3002\u767A\u6398\u3067\u6642\u4EE3\u306E\u7570\u306A\u308B\u8DEF\u9762\u3068\u6392\u6C34\u6E9D\u304C\u91CD\u306A\u3063\u3066\u51FA\u571F\u3057\u3001\u4E2D\u8EF8\u7DDA\u5357\u6BB5\u306E\u9053\u8DEF\u304C\u6570\u767E\u5E74\u306B\u308F\u305F\u308A\u4F4D\u7F6E\u3092\u5909\u3048\u3066\u3044\u306A\u3044\u3053\u3068\u304C\u88CF\u4ED8\u3051\u3089\u308C\u305F\u3002","\uBA85\xB7\uCCAD \uC2DC\uB300 \uC601\uC815\uBB38\uC5D0\uC11C \uC815\uC591\uBB38\uC73C\uB85C \uC774\uC5B4\uC9C0\uB358 \uC5B4\uB3C4\uB2E4. \uBC1C\uAD74\uC5D0\uC11C \uC2DC\uB300\uAC00 \uB2E4\uB978 \uB178\uBA74\uACFC \uBC30\uC218\uB85C\uAC00 \uACB9\uCCD0 \uB098\uC640, \uC911\uCD95\uC120 \uB0A8\uCABD \uB3C4\uB85C\uAC00 \uC218\uBC31 \uB144 \uB3D9\uC548 \uAC19\uC740 \uC790\uB9AC\uC5D0 \uC788\uC5C8\uC74C\uC774 \uD655\uC778\uB418\uC5C8\uB2E4."],\u524D\u95E8\u4E94\u724C\u697C:["The five-bay, six-post archway outside Zhengyangmen, the grandest archway in the capital, rebuilt to its original design in 2008.","\u6B63\u967D\u9580\u5916\u306B\u7ACB\u3064\u4E94\u9593\u516D\u67F1\u306E\u51B2\u5929\u724C\u697C\u3067\u3001\u90FD\u306E\u724C\u697C\u306E\u7B46\u982D\u30022008\u5E74\u306B\u539F\u72B6\u3069\u304A\u308A\u518D\u5EFA\u3055\u308C\u305F\u3002","\uC815\uC591\uBB38 \uBC16\uC5D0 \uC120 \uB2E4\uC12F \uCE78 \uC5EC\uC12F \uAE30\uB465\uC758 \uCDA9\uCC9C\uD328\uB8E8\uB85C \uB3C4\uC131 \uD328\uB8E8 \uAC00\uC6B4\uB370 \uC73C\uB738\uC774\uBA70, 2008\uB144\uC5D0 \uC6D0\uB798\uB300\uB85C \uBCF5\uC6D0\uB418\uC5C8\uB2E4."],\u6B63\u9633\u95E8\u7BAD\u697C:["The defensive arrow tower at the south end of Zhengyangmen's barbican, built of grey brick with four rows of arrow windows; the largest arrow tower of any Beijing gate. The barbican was removed in 1915 and the tower was remodelled and kept.","\u6B63\u967D\u9580\u306E\u7515\u57CE\u5357\u7AEF\u306B\u5EFA\u3064\u9632\u5FA1\u7528\u306E\u7BAD\u697C\u3067\u3001\u7070\u8272\u306E\u7149\u74E6\u9020\u306B\u56DB\u5C64\u306E\u77E2\u72ED\u9593\u3092\u958B\u304F\u3002\u5317\u4EAC\u306E\u57CE\u9580\u306E\u7BAD\u697C\u3067\u6700\u5927\u3002\u7515\u57CE\u306F1915\u5E74\u306B\u64A4\u53BB\u3055\u308C\u3001\u7BAD\u697C\u306F\u6539\u4FEE\u306E\u3046\u3048\u4FDD\u5B58\u3055\u308C\u305F\u3002","\uC815\uC591\uBB38 \uC639\uC131 \uB0A8\uCABD \uB05D\uC5D0 \uC120 \uBC29\uC5B4\uC6A9 \uC804\uB8E8\uB85C, \uD68C\uC0C9 \uBCBD\uB3CC\uB85C \uC313\uACE0 \uB124 \uCE35\uC758 \uD654\uC0B4\uCC3D\uC744 \uB0C8\uB2E4. \uBCA0\uC774\uC9D5 \uC131\uBB38 \uC804\uB8E8 \uAC00\uC6B4\uB370 \uAC00\uC7A5 \uD06C\uB2E4. \uC639\uC131\uC740 1915\uB144\uC5D0 \uCCA0\uAC70\uB418\uC5C8\uACE0 \uC804\uB8E8\uB294 \uACE0\uCCD0\uC11C \uB0A8\uACBC\uB2E4."],\u6B63\u9633\u95E8:["Known as Qianmen, the main south gate of the Ming\u2013Qing Inner City, completed in 1439 and the tallest of all Beijing's gates. The tower has a gable-and-hip roof with triple eaves in grey tiles edged in green glaze.","\u4FD7\u306B\u300C\u524D\u9580\u300D\u3068\u547C\u3070\u308C\u3001\u660E\u6E05\u5317\u4EAC\u5185\u57CE\u306E\u6B63\u5357\u9580\u3002\u660E\u306E\u6B63\u7D714\u5E74\uFF081439\uFF09\u306B\u5B8C\u6210\u3057\u3001\u5317\u4EAC\u306E\u5168\u57CE\u9580\u3067\u6700\u3082\u9AD8\u5927\u3002\u57CE\u697C\u306F\u91CD\u6A90\u6B47\u5C71\u4E09\u6EF4\u6C34\u3067\u3001\u7070\u8272\u306E\u7B52\u74E6\u306B\u7DD1\u7460\u7483\u306E\u7E01\u53D6\u308A\u3002",'\uD754\uD788 "\uC804\uBB38"\uC774\uB77C \uBD80\uB974\uB294 \uBA85\xB7\uCCAD \uBCA0\uC774\uC9D5 \uB0B4\uC131\uC758 \uC815\uB0A8\uBB38\uC73C\uB85C 1439\uB144\uC5D0 \uC644\uC131\uB418\uC5C8\uC73C\uBA70 \uBCA0\uC774\uC9D5 \uBAA8\uB4E0 \uC131\uBB38 \uAC00\uC6B4\uB370 \uAC00\uC7A5 \uB192\uACE0 \uD06C\uB2E4. \uC131\uB8E8\uB294 \uC138 \uACB9 \uCC98\uB9C8 \uD314\uC791\uC9C0\uBD95\uC73C\uB85C \uD68C\uC0C9 \uAE30\uC640\uC5D0 \uCD08\uB85D \uC720\uB9AC \uD14C\uB450\uB9AC\uB97C \uB458\uB800\uB2E4.'],\u5929\u5B89\u95E8\u5E7F\u573A:["In the Ming and Qing a T-shaped court (the Thousand-Step Corridor) lay before the palace; it was enlarged to its present form in the mid-20th century. The Monument to the People's Heroes and the Mao Memorial Hall stand on the axis, with the Great Hall of the People and the National Museum facing each other east and west, continuing the axis's balanced symmetry.","\u660E\u6E05\u671F\u306B\u306F\u5BAE\u5EF7\u524D\u306E\u300CT\u300D\u5B57\u5F62\u306E\u5E83\u5834\uFF08\u5343\u6B69\u5ECA\uFF09\u3067\u300120\u4E16\u7D00\u4E2D\u8449\u306B\u4ECA\u65E5\u306E\u5F62\u306B\u62E1\u5F35\u3055\u308C\u305F\u3002\u4EBA\u6C11\u82F1\u96C4\u8A18\u5FF5\u7891\u3068\u6BDB\u4E3B\u5E2D\u8A18\u5FF5\u5802\u304C\u4E2D\u8EF8\u4E0A\u306B\u3001\u4EBA\u6C11\u5927\u4F1A\u5802\u3068\u56FD\u5BB6\u535A\u7269\u9928\u304C\u6771\u897F\u5BFE\u79F0\u306B\u914D\u3055\u308C\u3001\u4E2D\u8EF8\u7DDA\u306E\u5747\u8861\u3068\u5BFE\u79F0\u306E\u539F\u5247\u3092\u53D7\u3051\u7D99\u3050\u3002",'\uBA85\xB7\uCCAD \uB54C\uB294 \uAD81\uAD90 \uC55E\uC758 "T" \uC790\uD615 \uAD11\uC7A5(\uCC9C\uBCF4\uB791)\uC774\uC5C8\uACE0, 20\uC138\uAE30 \uC911\uC5FD\uC5D0 \uC9C0\uAE08 \uBAA8\uC2B5\uC73C\uB85C \uB113\uD600\uC84C\uB2E4. \uC778\uBBFC\uC601\uC6C5\uAE30\uB150\uBE44\uC640 \uB9C8\uC624 \uC8FC\uC11D \uAE30\uB150\uB2F9\uC774 \uC911\uCD95 \uC704\uC5D0, \uC778\uBBFC\uB300\uD68C\uB2F9\uACFC \uAD6D\uAC00\uBC15\uBB3C\uAD00\uC774 \uB3D9\uC11C\uB85C \uB300\uCE6D\uC744 \uC774\uB8E8\uC5B4 \uC911\uCD95\uC120\uC758 \uADE0\uD615\uACFC \uB300\uCE6D \uC6D0\uCE59\uC744 \uC774\uC5C8\uB2E4.'],\u6BDB\u4E3B\u5E2D\u7EAA\u5FF5\u5802:["Completed in 1977 on the site of the former Gate of China. It has a double-eaved flat roof with golden glazed panels at the eaves, on a two-tier base of dark red granite.","1977\u5E74\u5B8C\u6210\u3001\u65E7\u4E2D\u83EF\u9580\u306E\u8DE1\u5730\u306B\u5EFA\u3064\u3002\u91CD\u6A90\u306E\u5E73\u5C4B\u6839\u3067\u3001\u8ED2\u306B\u91D1\u9EC4\u8272\u306E\u7460\u7483\u677F\u3092\u98FE\u308A\u3001\u4E0B\u306F\u4E8C\u5C64\u306E\u8D64\u8910\u8272\u306E\u82B1\u5D17\u5CA9\u306E\u57FA\u58C7\u3002","1977\uB144\uC5D0 \uC61B \uC911\uD654\uBB38 \uC790\uB9AC\uC5D0 \uC644\uACF5\uB418\uC5C8\uB2E4. \uACB9\uCC98\uB9C8 \uD3C9\uC9C0\uBD95\uC73C\uB85C \uCC98\uB9C8\uC5D0 \uD669\uAE08\uC0C9 \uC720\uB9AC\uD310\uC744 \uB458\uB800\uACE0, \uC544\uB798\uB294 \uB450 \uCE35\uC758 \uC801\uAC08\uC0C9 \uD654\uAC15\uC554 \uAE30\uB2E8\uC774\uB2E4."],\u4EBA\u6C11\u82F1\u96C4\u7EAA\u5FF5\u7891:[`Unveiled in 1958 at the centre of the square, on the axis. The north face bears the inscription "Eternal glory to the people's heroes"; eight white-marble reliefs wrap the plinth, and the top is a stone hip roof.`,"1958\u5E74\u9664\u5E55\u3001\u5E83\u5834\u306E\u4E2D\u5FC3\u3067\u4E2D\u8EF8\u7DDA\u4E0A\u306B\u7ACB\u3064\u3002\u7891\u306E\u5317\u9762\u306B\u300C\u4EBA\u6C11\u82F1\u96C4\u6C38\u5782\u4E0D\u673D\u300D\u3068\u523B\u307F\u3001\u9808\u5F25\u5EA7\u306E\u56DB\u5468\u306B\u6F22\u767D\u7389\u306E\u30EC\u30EA\u30FC\u30D58\u9762\u3092\u5D4C\u3081\u3001\u7891\u9802\u306F\u5EE1\u6BBF\u5F0F\u306E\u77F3\u306E\u5C4B\u6839\u3002",'1958\uB144\uC5D0 \uAD11\uC7A5 \uD55C\uAC00\uC6B4\uB370 \uC911\uCD95\uC120 \uC704\uC5D0 \uC138\uC6CC\uC84C\uB2E4. \uBE44 \uBD81\uBA74\uC5D0 "\uC778\uBBFC\uC601\uC6C5\uC601\uC218\uBD88\uD6C4"\uB97C \uC0C8\uACBC\uACE0, \uC218\uBBF8\uC88C \uB458\uB808\uC5D0 \uD55C\uBC31\uC625 \uBD80\uC870 8\uBA74\uC744 \uB07C\uC6E0\uC73C\uBA70 \uAF2D\uB300\uAE30\uB294 \uC6B0\uC9C4\uAC01 \uBAA8\uC591 \uB3CC\uC9C0\uBD95\uC774\uB2E4.'],\u56FD\u65D7\u6746:["At the north end of the square on the axis; the flag is raised and lowered daily at sunrise and sunset.","\u5E83\u5834\u306E\u5317\u7AEF\u3001\u4E2D\u8EF8\u7DDA\u4E0A\u306B\u3042\u308A\u3001\u6BCE\u65E5\u65E5\u306E\u51FA\u3068\u65E5\u306E\u5165\u308A\u306B\u56FD\u65D7\u306E\u63B2\u63DA\u30FB\u964D\u7D0D\u5F0F\u304C\u884C\u308F\u308C\u308B\u3002","\uAD11\uC7A5 \uBD81\uCABD \uB05D \uC911\uCD95\uC120 \uC704\uC5D0 \uC788\uC73C\uBA70, \uB0A0\uB9C8\uB2E4 \uD574 \uB730 \uB54C\uC640 \uD574 \uC9C8 \uB54C \uAD6D\uAE30 \uAC8C\uC591\xB7\uD558\uAC15\uC2DD\uC774 \uC5F4\uB9B0\uB2E4."],\u4EBA\u6C11\u5927\u4F1A\u5802:[`Completed in 1959 as one of the "Ten Great Buildings" for the 10th anniversary of the People's Republic. The east entrance has twelve 25 m grey marble columns under eaves trimmed in yellow and green glaze. It faces the National Museum across the square.`,"1959\u5E74\u5B8C\u6210\u3001\u5EFA\u56FD\u5341\u5468\u5E74\u306E\u300C\u5341\u5927\u5EFA\u7BC9\u300D\u306E\u4E00\u3064\u3002\u6771\u6B63\u9762\u306E\u6B63\u9580\u306B\u306F\u9AD8\u305525m\u306E\u7070\u8272\u5927\u7406\u77F3\u306E\u67F112\u672C\u304C\u4E26\u3073\u3001\u8ED2\u306F\u9EC4\u7DD1\u306E\u7460\u7483\u3067\u98FE\u3089\u308C\u308B\u3002\u5E83\u5834\u3092\u631F\u3093\u3067\u56FD\u5BB6\u535A\u7269\u9928\u3068\u5411\u304D\u5408\u3046\u3002",'1959\uB144\uC5D0 \uC644\uACF5\uB41C \uAC74\uAD6D 10\uC8FC\uB144 "10\uB300 \uAC74\uCD95"\uC758 \uD558\uB098\uB2E4. \uB3D9\uCABD \uC815\uBB38\uC5D0 \uB192\uC774 25m\uC758 \uD68C\uC0C9 \uB300\uB9AC\uC11D \uAE30\uB465 12\uAC1C\uAC00 \uC11C\uACE0 \uCC98\uB9C8\uB294 \uD669\uB85D \uC720\uB9AC\uB85C \uAFB8\uBA84\uB2E4. \uAD11\uC7A5\uC744 \uC0AC\uC774\uC5D0 \uB450\uACE0 \uAD6D\uAC00\uBC15\uBB3C\uAD00\uACFC \uB9C8\uC8FC\uD55C\uB2E4.'],\u4E2D\u56FD\u56FD\u5BB6\u535A\u7269\u9986:['Completed in 1959 (as the Museum of the Chinese Revolution and the Museum of Chinese History), one of the "Ten Great Buildings", and extended eastwards in 2011. Its west entrance is an open portico of 24 square columns, answering the Great Hall of the People opposite.',"1959\u5E74\u5B8C\u6210\uFF08\u65E7\u4E2D\u56FD\u9769\u547D\u535A\u7269\u9928\u30FB\u4E2D\u56FD\u6B74\u53F2\u535A\u7269\u9928\uFF09\u3001\u300C\u5341\u5927\u5EFA\u7BC9\u300D\u306E\u4E00\u3064\u3067\u30012011\u5E74\u306B\u6771\u3078\u62E1\u5F35\u3055\u308C\u305F\u3002\u897F\u9580\u306F24\u672C\u306E\u89D2\u67F1\u306B\u3088\u308B\u5439\u304D\u653E\u3061\u306E\u67F1\u5ECA\u3067\u3001\u4EBA\u6C11\u5927\u4F1A\u5802\u3068\u5411\u304B\u3044\u5408\u3046\u3002",'1959\uB144\uC5D0 \uC644\uACF5(\uC61B \uC911\uAD6D\uD601\uBA85\uBC15\uBB3C\uAD00\xB7\uC911\uAD6D\uC5ED\uC0AC\uBC15\uBB3C\uAD00)\uB41C "10\uB300 \uAC74\uCD95"\uC758 \uD558\uB098\uB85C, 2011\uB144\uC5D0 \uB3D9\uCABD\uC73C\uB85C \uC99D\uCD95\uD588\uB2E4. \uC11C\uBB38\uC740 \uB124\uBAA8 \uAE30\uB465 24\uAC1C\uB85C \uC774\uB8E8\uC5B4\uC9C4 \uC5F4\uB9B0 \uC8FC\uB791\uC73C\uB85C \uC778\uBBFC\uB300\uD68C\uB2F9\uACFC \uB9C8\uC8FC \uBCF8\uB2E4.'],\u5916\u91D1\u6C34\u6865:["Bridges over the Outer Golden Water River. The central Imperial Way bridge, the widest, was for the emperor; next come the bridges for princes and for ranked officials, and the outermost two lead to the Ancestral Temple and the Altar of Land and Grain. A pair of carved marble columns (huabiao) stands north and south.","\u5916\u91D1\u6C34\u6CB3\u306B\u67B6\u304B\u308B\u6A4B\u3002\u4E2D\u592E\u306E\u5FA1\u8DEF\u6A4B\u304C\u6700\u3082\u5E83\u304F\u7687\u5E1D\u5C02\u7528\u3067\u3001\u4E21\u5074\u306B\u738B\u516C\u6A4B\u3001\u54C1\u7D1A\u6A4B\u304C\u7D9A\u304D\u3001\u6700\u3082\u5916\u5074\u306E\u4E8C\u57FA\u306E\u516C\u751F\u6A4B\u306F\u305D\u308C\u305E\u308C\u592A\u5EDF\u3068\u793E\u7A37\u58C7\u3078\u901A\u3058\u308B\u3002\u6A4B\u306E\u5357\u5317\u306B\u83EF\u8868\u304C\u4E00\u5BFE\u305A\u3064\u7ACB\u3064\u3002","\uC678\uAE08\uC218\uD558\uC5D0 \uB193\uC778 \uB2E4\uB9AC\uB4E4\uC774\uB2E4. \uAC00\uC6B4\uB370 \uC5B4\uB85C\uAD50\uAC00 \uAC00\uC7A5 \uB113\uACE0 \uD669\uC81C \uC804\uC6A9\uC774\uBA70, \uC591\uC606\uC73C\uB85C \uC655\uACF5\uAD50\xB7\uD488\uAE09\uAD50\uAC00 \uC774\uC5B4\uC9C0\uACE0, \uAC00\uC7A5 \uBC14\uAE65 \uB450 \uACF5\uC0DD\uAD50\uB294 \uAC01\uAC01 \uD0DC\uBB18\uC640 \uC0AC\uC9C1\uB2E8\uC73C\uB85C \uD1B5\uD55C\uB2E4. \uB2E4\uB9AC \uB0A8\uBD81\uC5D0 \uD654\uD45C\uAC00 \uD55C \uC30D\uC529 \uC11C \uC788\uB2E4."],\u5929\u5B89\u95E8:[`Main gate of the Ming\u2013Qing Imperial City, begun in 1417 as Chengtianmen and renamed Tian'anmen in 1651. The tower is nine bays wide and five deep, numbers associated with the emperor, under a double-eaved gable-and-hip roof of yellow glazed tiles. Imperial edicts were proclaimed here in the "golden phoenix" ceremony.`,"\u660E\u6E05\u7687\u57CE\u306E\u6B63\u9580\u3067\u3001\u660E\u306E\u6C38\u697D15\u5E74\uFF081417\uFF09\u306B\u627F\u5929\u9580\u3068\u3057\u3066\u5275\u5EFA\u3055\u308C\u3001\u6E05\u306E\u9806\u6CBB8\u5E74\uFF081651\uFF09\u306B\u73FE\u540D\u3078\u6539\u3081\u3089\u308C\u305F\u3002\u57CE\u697C\u306F\u9762\u95CA\u4E5D\u9593\u30FB\u9032\u6DF1\u4E94\u9593\u3067\u300C\u4E5D\u4E94\u4E4B\u5C0A\u300D\u3092\u8868\u3057\u3001\u9EC4\u7460\u7483\u74E6\u306E\u91CD\u6A90\u6B47\u5C71\u9802\u3002\u8A54\u66F8\u3092\u9812\u5E03\u3059\u308B\u300C\u91D1\u9CF3\u9812\u8A54\u300D\u306E\u5100\u304C\u3053\u3053\u3067\u884C\u308F\u308C\u305F\u3002",'\uBA85\xB7\uCCAD \uD669\uC131\uC758 \uC815\uBB38\uC73C\uB85C 1417\uB144 \uC2B9\uCC9C\uBB38\uC73C\uB85C \uCC98\uC74C \uC9C0\uC5C8\uACE0 1651\uB144\uC5D0 \uC9C0\uAE08 \uC774\uB984\uC73C\uB85C \uBC14\uAFB8\uC5C8\uB2E4. \uC131\uB8E8\uB294 \uC815\uBA74 \uC544\uD649 \uCE78, \uCE21\uBA74 \uB2E4\uC12F \uCE78\uC73C\uB85C "\uAD6C\uC624\uC9C0\uC874"\uC744 \uB098\uD0C0\uB0B4\uBA70 \uB178\uB780 \uC720\uB9AC\uAE30\uC640 \uACB9\uCC98\uB9C8 \uD314\uC791\uC9C0\uBD95\uC774\uB2E4. \uC870\uC11C\uB97C \uBC18\uD3EC\uD558\uB294 "\uAE08\uBD09\uBC18\uC870" \uC758\uC2DD\uC774 \uC774\uACF3\uC5D0\uC11C \uC5F4\uB838\uB2E4.'],\u7AEF\u95E8:["Between Tian'anmen and the Meridian Gate, completed in 1420 in nearly the same form as Tian'anmen. In the Ming and Qing it stored the imperial regalia and served as a transition space for composing oneself before entering the Forbidden City.","\u5929\u5B89\u9580\u3068\u5348\u9580\u306E\u9593\u306B\u4F4D\u7F6E\u3057\u3001\u660E\u306E\u6C38\u697D18\u5E74\uFF081420\uFF09\u306B\u5B8C\u6210\u3002\u5F62\u5F0F\u306F\u5929\u5B89\u9580\u3068\u307B\u307C\u540C\u3058\u3002\u660E\u6E05\u306B\u306F\u7687\u5E1D\u306E\u5100\u4ED7\u3092\u53CE\u3081\u3001\u7D2B\u7981\u57CE\u306B\u5165\u308B\u524D\u306B\u5A01\u5100\u3092\u6574\u3048\u308B\u79FB\u884C\u7A7A\u9593\u3067\u3042\u3063\u305F\u3002","\uD188\uC548\uBA3C\uACFC \uC624\uBB38 \uC0AC\uC774\uC5D0 \uC788\uC73C\uBA70 1420\uB144\uC5D0 \uC644\uC131\uB418\uC5C8\uACE0 \uD615\uC2DD\uC740 \uD188\uC548\uBA3C\uACFC \uAC70\uC758 \uAC19\uB2E4. \uBA85\xB7\uCCAD \uB54C \uD669\uC81C\uC758 \uC758\uC7A5\uC744 \uBCF4\uAD00\uD588\uACE0, \uC790\uAE08\uC131\uC5D0 \uB4E4\uC5B4\uAC00\uAE30 \uC804\uC5D0 \uBAB8\uAC00\uC9D0\uC744 \uAC00\uB2E4\uB4EC\uB294 \uC804\uC774 \uACF5\uAC04\uC774\uC5C8\uB2E4."],\u592A\u5E99\u621F\u95E8:["Gate to the main courtyard of the Ancestral Temple, an original Ming structure; 120 halberds once stood inside and outside it.","\u592A\u5EDF\u6B63\u6BBF\u9662\u843D\u306E\u5927\u9580\u3067\u3001\u660E\u4EE3\u306E\u539F\u69CB\u3002\u304B\u3064\u3066\u9580\u306E\u5185\u5916\u306B\u621F120\u672C\u304C\u4E26\u3079\u3089\u308C\u305F\u3002","\uD0DC\uBB18 \uC815\uC804 \uC6D0\uB77D\uC758 \uB300\uBB38\uC73C\uB85C \uBA85\uB098\uB77C \uB54C \uC6D0\uB798 \uAC74\uBB3C\uC774\uB2E4. \uC608\uC804\uC5D0\uB294 \uBB38 \uC548\uD30E\uC5D0 \uCC3D 120\uC790\uB8E8\uB97C \uC138\uC6CC \uB450\uC5C8\uB2E4."],\u592A\u5E99\u4EAB\u6BBF:[`Main hall where Ming and Qing emperors sacrificed to their ancestors, the "ancestors" of "ancestors on the left, land and grain on the right". Close in size to the Hall of Supreme Harmony, with beams and columns largely of whole golden-thread nanmu logs, it is a rare surviving work of Ming official architecture. Since 1950 it has been the Working People's Cultural Palace.`,"\u660E\u6E05\u306E\u7687\u5E1D\u304C\u7956\u5148\u3092\u7940\u3063\u305F\u6B63\u6BBF\u3067\u3001\u300C\u5DE6\u7956\u53F3\u793E\u300D\u306E\u300C\u7956\u300D\u306B\u3042\u305F\u308B\u3002\u898F\u6A21\u306F\u592A\u548C\u6BBF\u306B\u5339\u6575\u3057\u3001\u6881\u67F1\u306E\u591A\u304F\u306B\u4E00\u672C\u3082\u306E\u306E\u91D1\u7D72\u6960\u6728\u3092\u7528\u3044\u305F\u3001\u660E\u4EE3\u5B98\u5F0F\u5EFA\u7BC9\u306E\u8CB4\u91CD\u306A\u5B9F\u4F8B\u30021950\u5E74\u304B\u3089\u5317\u4EAC\u5E02\u52B4\u50CD\u4EBA\u6C11\u6587\u5316\u5BAE\u3068\u306A\u3063\u3066\u3044\u308B\u3002",'\uBA85\xB7\uCCAD \uD669\uC81C\uAC00 \uC870\uC0C1\uC5D0\uAC8C \uC81C\uC0AC \uC9C0\uB0B4\uB358 \uC815\uC804\uC73C\uB85C "\uC88C\uC870\uC6B0\uC0AC"\uC758 "\uC870"\uC5D0 \uD574\uB2F9\uD55C\uB2E4. \uADDC\uBAA8\uAC00 \uD0DC\uD654\uC804\uC5D0 \uBC84\uAE08\uAC00\uBA70 \uB4E4\uBCF4\uC640 \uAE30\uB465 \uB300\uBD80\uBD84\uC5D0 \uD1B5\uC9DC \uAE08\uC0AC\uB0A8\uBAA9\uC744 \uC368\uC11C \uBA85\uB098\uB77C \uAD00\uC2DD \uAC74\uCD95\uC758 \uADC0\uC911\uD55C \uC2E4\uBB3C\uC774\uB2E4. 1950\uB144\uBD80\uD130 \uBCA0\uC774\uC9D5\uC2DC \uB178\uB3D9\uC778\uBBFC\uBB38\uD654\uAD81\uC774\uB2E4.'],\u592A\u5E99\u5BDD\u6BBF:["Where the tablets of past emperors and empresses were normally kept; at sacrifices they were carried to the Sacrificial Hall.","\u5E73\u6642\u306B\u6B74\u4EE3\u5E1D\u540E\u306E\u795E\u4F4D\u3092\u7940\u308B\u6BBF\u3067\u3001\u796D\u7940\u306E\u969B\u306B\u795E\u4F4D\u3092\u4EAB\u6BBF\u3078\u79FB\u3057\u305F\u3002","\uD3C9\uC18C \uC5ED\uB300 \uD669\uC81C\uC640 \uD669\uD6C4\uC758 \uC2E0\uC704\uB97C \uBAA8\uC2DC\uB358 \uC804\uAC01\uC73C\uB85C, \uC81C\uC0AC \uB54C\uB294 \uC2E0\uC704\uB97C \uD5A5\uC804\uC73C\uB85C \uC62E\uACBC\uB2E4."],\u592A\u5E99\u7967\u5E99:["A hall in its own courtyard for the tablets of the emperors' distant ancestors.","\u7687\u5E1D\u306E\u9060\u7956\u306E\u795E\u4F4D\u3092\u7940\u308B\u6BBF\u3067\u3001\u72EC\u7ACB\u3057\u305F\u9662\u843D\u3092\u306A\u3059\u3002","\uD669\uC81C\uC758 \uBA3C \uC870\uC0C1 \uC2E0\uC704\uB97C \uBAA8\uC2E0 \uC804\uAC01\uC73C\uB85C \uB530\uB85C \uC6D0\uB77D\uC744 \uC774\uB8EC\uB2E4."],\u592A\u5E99:["Ancestral temple of the Ming and Qing imperial families, begun in 1420, east of the route between Tian'anmen and the Meridian Gate. Inside three rings of walls, the front, middle and rear halls line up north\u2013south among groves of ancient cypresses.","\u660E\u6E05\u4E21\u4EE3\u306E\u7687\u5BA4\u306E\u7956\u5EDF\u3067\u3001\u660E\u306E\u6C38\u697D18\u5E74\uFF081420\uFF09\u306B\u5275\u5EFA\u3055\u308C\u3001\u5929\u5B89\u9580\u3068\u5348\u9580\u306E\u9593\u306E\u6771\u5074\u306B\u4F4D\u7F6E\u3059\u308B\u3002\u4E09\u91CD\u306E\u56F2\u58C1\u306E\u5185\u306B\u524D\u30FB\u4E2D\u30FB\u5F8C\u306E\u4E09\u6BBF\u304C\u5357\u5317\u8EF8\u4E0A\u306B\u4E26\u3073\u3001\u9662\u5185\u306B\u306F\u53E4\u3044\u67CF\u304C\u6797\u3092\u306A\u3059\u3002","\uBA85\xB7\uCCAD \uB450 \uC655\uC870 \uD669\uC2E4\uC758 \uC885\uBB18\uB85C 1420\uB144\uC5D0 \uCC98\uC74C \uC9C0\uC5C8\uC73C\uBA70 \uD188\uC548\uBA3C\uACFC \uC624\uBB38 \uC0AC\uC774 \uB3D9\uCABD\uC5D0 \uC788\uB2E4. \uC138 \uACB9 \uB2F4\uC7A5 \uC548\uC5D0 \uC55E\xB7\uAC00\uC6B4\uB370\xB7\uB4A4 \uC138 \uC804\uAC01\uC774 \uB0A8\uBD81 \uCD95\uC744 \uB530\uB77C \uB298\uC5B4\uC11C\uACE0, \uB730\uC5D0\uB294 \uC624\uB798\uB41C \uCE21\uBC31\uB098\uBB34 \uC232\uC774 \uC788\uB2E4."],"\u793E\u7A37\u575B \xB7 \u4E94\u8272\u571F":['Where Ming and Qing emperors sacrificed to the gods of the soil (She) and of grain (Ji), the "land and grain" of "ancestors on the left, land and grain on the right". The top is laid with five colours of earth by direction: green east, red south, white west, black north and yellow centre, signifying that all land under heaven belongs to the sovereign. The glazed bricks of the four low walls match the colours.',"\u660E\u6E05\u306E\u7687\u5E1D\u304C\u592A\u793E\uFF08\u571F\u306E\u795E\uFF09\u3068\u592A\u7A37\uFF08\u7A40\u7269\u306E\u795E\uFF09\u3092\u7940\u3063\u305F\u5834\u6240\u3067\u3001\u300C\u5DE6\u7956\u53F3\u793E\u300D\u306E\u300C\u793E\u300D\u3002\u58C7\u9762\u306B\u306F\u65B9\u4F4D\u306B\u5F93\u3044\u4E94\u8272\u306E\u571F\u3092\u6577\u304F\u3002\u6771\u306F\u9752\u3001\u5357\u306F\u8D64\u3001\u897F\u306F\u767D\u3001\u5317\u306F\u9ED2\u3001\u4E2D\u592E\u306F\u9EC4\u3067\u3001\u300C\u666E\u5929\u306E\u4E0B\u3001\u738B\u571F\u306B\u975E\u3056\u308B\u306F\u83AB\u3057\u300D\u3092\u8868\u3059\u3002\u56DB\u9762\u306E\u4F4E\u3044\u58C1\u306E\u7460\u7483\u7149\u74E6\u3082\u8272\u3092\u5BFE\u5FDC\u3055\u305B\u308B\u3002",'\uBA85\xB7\uCCAD \uD669\uC81C\uAC00 \uD0DC\uC0AC(\uD1A0\uC9C0\uC2E0)\uC640 \uD0DC\uC9C1(\uACE1\uC2DD\uC2E0)\uC5D0\uAC8C \uC81C\uC0AC \uC9C0\uB0B4\uB358 \uACF3\uC73C\uB85C "\uC88C\uC870\uC6B0\uC0AC"\uC758 "\uC0AC"\uC5D0 \uD574\uB2F9\uD55C\uB2E4. \uB2E8 \uC704\uC5D0 \uBC29\uC704\uC5D0 \uB530\uB77C \uC624\uC0C9\uD1A0\uB97C \uAE54\uC558\uB294\uB370 \uB3D9\uCABD\uC740 \uCCAD, \uB0A8\uCABD\uC740 \uC801, \uC11C\uCABD\uC740 \uBC31, \uBD81\uCABD\uC740 \uD751, \uAC00\uC6B4\uB370\uB294 \uD669\uC73C\uB85C "\uD558\uB298 \uC544\uB798 \uC655\uC758 \uB545\uC774 \uC544\uB2CC \uACF3\uC774 \uC5C6\uB2E4"\uB294 \uB73B\uC774\uB2E4. \uC0AC\uBC29 \uB0AE\uC740 \uB2F4\uC758 \uC720\uB9AC \uBCBD\uB3CC \uC0C9\uB3C4 \uC774\uC5D0 \uB9DE\uCD94\uC5C8\uB2E4.'],"\u4E2D\u5C71\u5802\uFF08\u62DC\u6BBF\uFF09":["Where the emperor performed the rite when it rained during the sacrifice to land and grain; an original Ming building. Sun Yat-sen's coffin lay in state here in 1925, and it was later renamed Zhongshan Hall. Because the sacrifice faced south, the hall stands north of the altar.","\u7687\u5E1D\u304C\u793E\u7A37\u3092\u7940\u308B\u969B\u3001\u96E8\u5929\u306E\u3068\u304D\u306B\u3053\u3053\u3067\u793C\u3092\u884C\u3063\u305F\u3002\u660E\u4EE3\u306E\u539F\u69CB\u30021925\u5E74\u306B\u5B6B\u6587\u306E\u970A\u67E9\u304C\u5B89\u7F6E\u3055\u308C\u3001\u306E\u3061\u4E2D\u5C71\u5802\u3068\u6539\u79F0\u3055\u308C\u305F\u3002\u793E\u7A37\u58C7\u306E\u796D\u7940\u306F\u5317\u304B\u3089\u5357\u3078\u5411\u304B\u3063\u3066\u884C\u308F\u308C\u308B\u305F\u3081\u3001\u6BBF\u306F\u58C7\u306E\u5317\u306B\u3042\u308B\u3002","\uC0AC\uC9C1 \uC81C\uC0AC \uB54C \uBE44\uAC00 \uC624\uBA74 \uD669\uC81C\uAC00 \uC774\uACF3\uC5D0\uC11C \uC608\uB97C \uD589\uD588\uB2E4. \uBA85\uB098\uB77C \uB54C \uC6D0\uB798 \uAC74\uBB3C\uC774\uB2E4. 1925\uB144 \uC468\uC6D0\uC758 \uC601\uAD6C\uAC00 \uC774\uACF3\uC5D0 \uC548\uCE58\uB418\uC5C8\uACE0 \uB4A4\uC5D0 \uC911\uC0B0\uB2F9\uC73C\uB85C \uC774\uB984\uC744 \uBC14\uAFB8\uC5C8\uB2E4. \uC0AC\uC9C1 \uC81C\uC0AC\uB294 \uBD81\uCABD\uC5D0\uC11C \uB0A8\uCABD\uC744 \uD5A5\uD574 \uC9C0\uB0C8\uAE30 \uB54C\uBB38\uC5D0 \uC804\uAC01\uC774 \uC81C\uB2E8 \uBD81\uCABD\uC5D0 \uC788\uB2E4."],\u793E\u7A37\u575B:["Begun in 1420, symmetrical with the Ancestral Temple across the axis. It opened as Central Park in 1914 and was renamed Zhongshan Park in 1928.","\u660E\u306E\u6C38\u697D18\u5E74\uFF081420\uFF09\u306B\u5275\u5EFA\u3055\u308C\u3001\u4E2D\u8EF8\u7DDA\u3092\u631F\u3093\u3067\u592A\u5EDF\u3068\u5BFE\u79F0\u30021914\u5E74\u306B\u4E2D\u592E\u516C\u5712\u3068\u3057\u3066\u958B\u653E\u3055\u308C\u30011928\u5E74\u306B\u4E2D\u5C71\u516C\u5712\u3068\u6539\u79F0\u3055\u308C\u305F\u3002","1420\uB144\uC5D0 \uCC98\uC74C \uC9C0\uC5C8\uC73C\uBA70 \uC911\uCD95\uC120\uC744 \uC0AC\uC774\uC5D0 \uB450\uACE0 \uD0DC\uBB18\uC640 \uB300\uCE6D\uC744 \uC774\uB8EC\uB2E4. 1914\uB144 \uC911\uC559\uACF5\uC6D0\uC73C\uB85C \uAC1C\uBC29\uB418\uC5C8\uACE0 1928\uB144\uC5D0 \uC911\uC0B0\uACF5\uC6D0\uC73C\uB85C \uC774\uB984\uC744 \uBC14\uAFB8\uC5C8\uB2E4."],\u6545\u5BAB:["The imperial palace of the Ming and Qing dynasties and the heart of the Central Axis. The Three Great Halls of the Outer Court and the Three Rear Palaces of the Inner Court line up along the axis. Zoom in to select individual halls.","\u660E\u6E05\u4E21\u4EE3\u306E\u7687\u5BAE\u3067\u3001\u4E2D\u8EF8\u7DDA\u306E\u6838\u5FC3\u3002\u5916\u671D\u306E\u4E09\u5927\u6BBF\u3068\u5185\u5EF7\u306E\u5F8C\u4E09\u5BAE\u304C\u4E2D\u8EF8\u306B\u6CBF\u3063\u3066\u9806\u306B\u4E26\u3076\u3002\u8FD1\u3065\u304F\u3068\u500B\u3005\u306E\u5BAE\u6BBF\u3092\u9078\u629E\u3067\u304D\u308B\u3002","\uBA85\xB7\uCCAD \uB450 \uC655\uC870\uC758 \uD669\uAD81\uC774\uC790 \uC911\uCD95\uC120\uC758 \uD575\uC2EC\uC774\uB2E4. \uC678\uC870\uC758 \uC0BC\uB300\uC804\uACFC \uB0B4\uC815\uC758 \uD6C4\uC0BC\uAD81\uC774 \uCD95\uC744 \uB530\uB77C \uCC28\uB840\uB85C \uB298\uC5B4\uC120\uB2E4. \uAC00\uAE4C\uC774 \uB2E4\uAC00\uAC00\uBA74 \uAC01 \uC804\uAC01\uC744 \uC120\uD0DD\uD560 \uC218 \uC788\uB2E4."],"\u5730\u5B89\u95E8\u96C1\u7FC5\u697C\uFF08\u4E1C\uFF09":Qt,"\u5730\u5B89\u95E8\u96C1\u7FC5\u697C\uFF08\u897F\uFF09":Qt,\u4E07\u5B81\u6865:['Built in 1285 in the Yuan dynasty, the oldest bridge on the axis, popularly the "Back Gate Bridge". It crosses the Yu River channel from Shichahai to the Tonghui Canal, once the choke point for grain barges entering the Yuan capital; stone water-guardian beasts sit on both banks below.',"\u5143\u306E\u81F3\u514322\u5E74\uFF081285\uFF09\u5275\u5EFA\u3001\u4E2D\u8EF8\u7DDA\u4E0A\u3067\u6700\u53E4\u306E\u6A4B\u3067\u3001\u4FD7\u306B\u5F8C\u9580\u6A4B\u3068\u547C\u3076\u3002\u4EC0\u5239\u6D77\u304B\u3089\u901A\u6075\u6CB3\u3078\u901A\u3058\u308B\u7389\u6CB3\u306E\u6C34\u8DEF\u306B\u67B6\u304B\u308A\u3001\u5143\u5927\u90FD\u306E\u6F15\u904B\u304C\u57CE\u5185\u3078\u5165\u308B\u8981\u885D\u3067\u3042\u3063\u305F\u3002\u6A4B\u4E0B\u306E\u4E21\u5CB8\u306B\u77F3\u5F6B\u306E\u93AE\u6C34\u7363\u304C\u3042\u308B\u3002","1285\uB144 \uC6D0\uB098\uB77C \uB54C \uCC98\uC74C \uB193\uC740 \uC911\uCD95\uC120\uC5D0\uC11C \uAC00\uC7A5 \uC624\uB798\uB41C \uB2E4\uB9AC\uB85C \uD754\uD788 \uD6C4\uBB38\uAD50\uB77C \uD55C\uB2E4. \uC2A4\uCC28\uD558\uC774\uC5D0\uC11C \uD1B5\uD61C\uD558\uB85C \uC774\uC5B4\uC9C0\uB294 \uC625\uD558 \uBB3C\uAE38\uC5D0 \uAC78\uCCD0 \uC6D0 \uB300\uB3C4\uB85C \uB4E4\uC5B4\uC624\uB294 \uC870\uC6B4\uC758 \uAE38\uBAA9\uC774\uC5C8\uC73C\uBA70, \uB2E4\uB9AC \uC544\uB798 \uC591\uCABD \uAE30\uC2AD\uC5D0 \uB3CC\uB85C \uC0C8\uAE34 \uC9C4\uC218\uC218\uAC00 \uC788\uB2E4."],\u9F13\u697C:['The timekeeping centre of the Yuan, Ming and Qing capitals; the present building dates from 1420. A brick platform carries a timber tower that once held 25 drums (one master drum and 24 for the solar terms), source of the phrase "evening drum, morning bell".',"\u5143\u660E\u6E05\u4E09\u4EE3\u306E\u90FD\u306E\u6642\u5831\u306E\u4E2D\u5FC3\u3067\u3001\u73FE\u5B58\u5EFA\u7269\u306F\u660E\u306E\u6C38\u697D18\u5E74\uFF081420\uFF09\u5EFA\u7ACB\u3002\u7149\u74E6\u306E\u57CE\u53F0\u306E\u4E0A\u306B\u6728\u9020\u306E\u697C\u95A3\u304C\u8F09\u308A\u3001\u697C\u4E0A\u306B\u306F\u304B\u3064\u3066\u66F4\u9F1325\u9762\uFF08\u4E3B\u9F131\u3001\u7FA4\u9F1324\u3067\u4E8C\u5341\u56DB\u7BC0\u6C17\u306B\u5BFE\u5FDC\uFF09\u304C\u7F6E\u304B\u308C\u3001\u300C\u66AE\u9F13\u6668\u9418\u300D\u306E\u8A9E\u306E\u7531\u6765\u3068\u306A\u3063\u305F\u3002",'\uC6D0\xB7\uBA85\xB7\uCCAD \uC138 \uC655\uC870 \uB3C4\uC131\uC758 \uC2DC\uBCF4 \uC911\uC2EC\uC73C\uB85C \uD604\uC874 \uAC74\uBB3C\uC740 1420\uB144\uC5D0 \uC9C0\uC5C8\uB2E4. \uBCBD\uB3CC \uC131\uB300 \uC704\uC5D0 \uBAA9\uC870 \uB204\uAC01\uC744 \uC5B9\uC5C8\uACE0, \uB204\uAC01\uC5D0\uB294 \uC6D0\uB798 \uBD81 25\uAC1C(\uC8FC\uACE0 1\uAC1C\uC640 24\uC808\uAE30\uC5D0 \uB9DE\uCD98 \uAD70\uACE0 24\uAC1C)\uB97C \uB450\uC5B4 "\uC800\uB141 \uBD81, \uC0C8\uBCBD \uC885"\uC774\uB77C\uB294 \uB9D0\uC774 \uC5EC\uAE30\uC11C \uB098\uC654\uB2E4.'],\u949F\u697C:["The northern end point of the Central Axis, about 100 m north of the Drum Tower. Rebuilt in 1745 entirely of brick and stone with beamless vaults to guard against fire, it houses a Yongle-era bronze bell of about 63 tonnes, the heaviest surviving ancient bell in China.","\u4E2D\u8EF8\u7DDA\u306E\u5317\u306E\u7AEF\u70B9\u3067\u3001\u9F13\u697C\u306E\u5317\u7D04100m\u3002\u73FE\u5B58\u5EFA\u7269\u306F\u6E05\u306E\u4E7E\u968610\u5E74\uFF081745\uFF09\u306E\u518D\u5EFA\u3067\u3001\u9632\u706B\u306E\u305F\u3081\u5168\u4F53\u3092\u7149\u74E6\u3068\u77F3\u306E\u7121\u6881\u30A2\u30FC\u30C1\u69CB\u9020\u3068\u3057\u305F\u3002\u697C\u5185\u306B\u306F\u660E\u306E\u6C38\u697D\u5E74\u9593\u92F3\u9020\u306E\u9285\u9418\uFF08\u7D0463\u30C8\u30F3\uFF09\u304C\u639B\u304B\u308A\u3001\u4E2D\u56FD\u306B\u73FE\u5B58\u3059\u308B\u6700\u91CD\u306E\u53E4\u9418\u3067\u3042\u308B\u3002","\uC911\uCD95\uC120\uC758 \uBD81\uCABD \uB05D\uC810\uC73C\uB85C \uACE0\uB8E8 \uBD81\uCABD \uC57D 100m\uC5D0 \uC788\uB2E4. \uD604\uC874 \uAC74\uBB3C\uC740 1745\uB144\uC5D0 \uB2E4\uC2DC \uC9C0\uC5C8\uC73C\uBA70, \uBD88\uC744 \uB9C9\uC73C\uB824\uACE0 \uC804\uCCB4\uB97C \uBCBD\uB3CC\xB7\uB3CC \uBB34\uB7C9 \uC544\uCE58 \uAD6C\uC870\uB85C \uD588\uB2E4. \uC548\uC5D0 \uC601\uB77D \uC5F0\uAC04\uC5D0 \uC8FC\uC870\uD55C \uC57D 63\uD1A4\uC758 \uCCAD\uB3D9 \uC885\uC774 \uAC78\uB824 \uC788\uB294\uB370, \uC911\uAD6D\uC5D0 \uB0A8\uC740 \uAC00\uC7A5 \uBB34\uAC70\uC6B4 \uC61B \uC885\uC774\uB2E4."],\u949F\u9F13\u697C:["The Drum Tower to the south and the Bell Tower to the north together form the northern end of the axis. Beating the drum and striking the bell to mark the hours continued until 1924.","\u5357\u306E\u9F13\u697C\u3068\u5317\u306E\u9418\u697C\u304C\u3068\u3082\u306B\u4E2D\u8EF8\u7DDA\u306E\u5317\u7AEF\u3092\u306A\u3059\u3002\u592A\u9F13\u3067\u66F4\u3092\u5B9A\u3081\u9418\u3067\u6642\u3092\u544A\u3052\u308B\u5236\u5EA6\u306F1924\u5E74\u307E\u3067\u7D9A\u3044\u305F\u3002","\uB0A8\uCABD\uC758 \uACE0\uB8E8\uC640 \uBD81\uCABD\uC758 \uC885\uB8E8\uAC00 \uD568\uAED8 \uC911\uCD95\uC120\uC758 \uBD81\uB2E8\uC744 \uC774\uB8EC\uB2E4. \uBD81\uC73C\uB85C \uBC24 \uC2DC\uAC01\uC744 \uC815\uD558\uACE0 \uC885\uC73C\uB85C \uB54C\uB97C \uC54C\uB9AC\uB294 \uC81C\uB3C4\uB294 1924\uB144\uAE4C\uC9C0 \uC774\uC5B4\uC84C\uB2E4."]},S=(t,a,n)=>[t,a,n],In={\u5348\u95E8:S("Platform 12 m \xB7 total height 37.95 m \xB7 main tower 9 bays wide","\u57CE\u53F0\u9AD812m\u30FB\u7DCF\u9AD837.95m\u30FB\u6B63\u697C\u9762\u95CA9\u9593","\uC131\uB300 \uB192\uC774 12m \xB7 \uC804\uCCB4 \uB192\uC774 37.95m \xB7 \uC815\uB8E8 \uC815\uBA74 9\uCE78"),\u5185\u91D1\u6C34\u6865:S("Five white-marble arch bridges","\u6F22\u767D\u7389\u306E\u30A2\u30FC\u30C1\u6A4B5\u57FA","\uD55C\uBC31\uC625 \uC544\uCE58\uAD50 5\uAE30"),\u592A\
