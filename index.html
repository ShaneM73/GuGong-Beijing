<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Beijing Central Axis 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{ /* layout: full-bleed 3D scene; lacquer-blue plaque panels float at the edges, gold hairlines, vermilion for active state */
  --ink:#0f1c36; --panel:rgba(15,28,54,.84); --gold:#e3bd62; --gold-dim:rgba(227,189,98,.38); --paper:#f3ecda; --mute:#b9c2d6; --cinnabar:#c8402b;
  --display:"Noto Serif SC","Songti SC","STSong","SimSun",serif; --body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;width:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;opacity:0;transition:opacity .25s;white-space:nowrap;font-family:var(--display);font-weight:600;color:#fff;text-shadow:0 0 3px #0b1326,0 1px 5px #0b1326,0 0 2px #0b1326;will-change:transform}
.lab.r1{font-size:14px;letter-spacing:.08em}.lab.r2{font-size:11.5px;color:#f6e7bd}
.lab::after{content:"";display:block;width:1px;height:9px;margin:1px auto 0;background:rgba(255,255,255,.75)}
.plate{background:var(--panel);border:1px solid var(--gold-dim);border-radius:4px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hd{position:absolute;left:12px;top:12px;padding:9px 14px 10px;max-width:calc(100% - 92px);pointer-events:none}
#langs{display:flex;gap:4px;margin-top:7px;pointer-events:auto;flex-wrap:wrap}
#langs button{padding:3px 8px;font-size:11.5px;border-radius:3px;border:1px solid var(--gold-dim);background:transparent;color:var(--mute);font-family:var(--body)}
#langs button[aria-pressed="true"]{background:var(--cinnabar);border-color:var(--gold);color:#fff}
#hd h1{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.22em;color:var(--gold);line-height:1.15}
#hd p{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.5;font-variant-numeric:tabular-nums}
#tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#tools button{width:60px;padding:7px 0 6px;font-size:12px;letter-spacing:.1em;background:var(--panel);border:1px solid var(--gold-dim);border-radius:4px;color:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#tools button[aria-pressed="true"]{background:var(--cinnabar);border-color:var(--gold);color:#fff}
#compass{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--gold-dim);margin-top:4px}
#needle{transform-origin:0 0}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:0 0 10px;pointer-events:none}
#bottom>*{pointer-events:auto}
#card{margin:0 12px;padding:12px 14px 12px;max-width:440px;max-height:44vh;overflow:auto;user-select:text;-webkit-user-select:text}
#card[hidden]{display:none}
#cKind{font-size:11px;letter-spacing:.14em;color:var(--gold)}
#cName{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.12em;margin:2px 0 6px;text-wrap:balance}
#cDims{font-size:12px;color:var(--gold);line-height:1.55;font-variant-numeric:tabular-nums;padding:5px 0;border-top:1px solid var(--gold-dim);border-bottom:1px solid var(--gold-dim);margin-bottom:7px}
#cInfo{font-size:13.5px;line-height:1.7;color:var(--paper)}
#cGeo{font-size:11px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{padding:7px 14px;font-size:13px;border-radius:3px;border:1px solid var(--gold-dim);background:transparent}
.acts #bIn{background:var(--cinnabar);border-color:var(--gold);color:#fff;font-weight:600;letter-spacing:.08em}
.acts [hidden]{display:none}
#chips{display:flex;gap:6px;overflow-x:auto;padding:2px 12px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;padding:8px 12px;font-size:13px;font-family:var(--display);font-weight:600;letter-spacing:.06em;background:var(--panel);border:1px solid var(--gold-dim);border-radius:3px;color:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#chips button.has-in::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
#chips button[aria-pressed="true"]{background:var(--cinnabar);border-color:var(--gold);color:#fff}
#hint{align-self:center;font-size:12px;padding:6px 12px;color:var(--paper);transition:opacity .6s}
#hint.gone{display:none}
#inbar{position:absolute;left:12px;top:12px;display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px}
#inName{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.14em;color:var(--gold)}
#bOut{padding:7px 12px;font-size:13px;background:var(--cinnabar);border:1px solid var(--gold);border-radius:3px;color:#fff}
#app[data-mode="in"] #inbar{display:flex}
#app[data-mode="in"] #hd,#app[data-mode="in"] #bHomeWrap{display:none}
#veil{position:absolute;inset:0;display:grid;place-items:center;background:var(--ink);color:var(--gold);font-family:var(--display);font-size:16px;letter-spacing:.3em;padding:24px;text-align:center;line-height:1.8;transition:opacity .5s}
#veil.gone{opacity:0;pointer-events:none}
@media (min-width:760px){#hd h1{font-size:28px}#card{margin-left:16px}#chips{padding-left:16px}.lab.r1{font-size:16px}.lab.r2{font-size:12.5px}}
:lang(en) #hd h1,:lang(en) #cName,:lang(en) #inName{letter-spacing:.04em}
:lang(en) .lab.r1{letter-spacing:.02em}
:lang(en) #tools button,:lang(en) #chips button{letter-spacing:.02em}
#tools button{font-size:11.5px;line-height:1.25}
:lang(ja){--display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;--body:-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
:lang(ko){--display:"Noto Serif KR","AppleMyungjo","Batang",serif;--body:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
:lang(ja) #hd h1,:lang(ko) #hd h1{letter-spacing:.12em}
@media (prefers-reduced-motion:reduce){.lab,#hint,#veil{transition:none}}
</style>
</head>
<body>
<div id="app" data-mode="out">
  <canvas id="c" tabindex="0" data-ta="canvas" aria-label="3D model of the Beijing Central Axis"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <header id="hd" class="plate">
    <h1 data-t="title">Beijing Central Axis</h1>
    <p><span data-t="sub1"></span><br><span data-t="sub2"></span> · <span id="stat"></span></p>
    <div id="langs" role="group" data-ta="lang"></div>
  </header>
  <div id="inbar" class="plate"><span id="inName"></span><button id="bOut" type="button" data-t="out">Leave</button></div>
  <div id="tools">
    <button id="bCut" type="button" data-t="cut" data-tt="cutT"></button>
    <button id="bLab" type="button" data-t="lab" data-tt="labT"></button>
    <button id="bSh" type="button" data-t="sh" data-tt="shT"></button>
    <button id="bHome" type="button" data-t="home" data-tt="homeT"></button>
    <button id="bFC" type="button" data-t="fc" data-tt="fcT"></button>
    <div id="compass" data-tt="compass">
      <svg width="40" height="40" viewBox="-20 -20 40 40" aria-hidden="true"><g id="needle"><path d="M0-16 5 0H-5Z" fill="#c8402b"/><path d="M0 16 5 0H-5Z" fill="#b9c2d6"/><text y="-5.5" x="0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#fff" font-family="sans-serif">N</text></g></svg>
    </div>
  </div>
  <div id="bottom">
    <div id="hint" class="plate" data-t="hint"></div>
    <section id="card" class="plate" hidden aria-live="polite">
      <div id="cKind"></div>
      <h2 id="cName"></h2>
      <p id="cDims"></p>
      <p id="cInfo"></p>
      <p id="cGeo"></p>
      <div class="acts"><button id="bIn" type="button" data-t="enter"></button><button id="bFly" type="button" data-t="fly"></button><button id="bClose" type="button" data-t="close"></button></div>
    </section>
    <nav id="chips" data-ta="nav"></nav>
  </div>
  <div id="veil">Building the Central Axis…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

erial City","\u7687\u57CE","\uD669\uC131"],["\u95E8","Gate","\u9580","\uBB38"],["\u7687\u57CE\u6B63\u95E8","Main gate of the Imperial City","\u7687\u57CE\u306E\u6B63\u9580","\uD669\uC131 \uC815\uBB38"],["\u897F\u82D1\u4E09\u6D77","Three Lakes of the Western Garden","\u897F\u82D1\u4E09\u6D77","\uC11C\uC6D0 \uC0BC\uD574"]],bt=['One of four towers at the corners of the palace wall. Its three tiers of eaves, cross-shaped ridges and gables on all four sides earned the folk description "nine beams, eighteen pillars, seventy-two ridges"; it is among the most intricate timber structures in the palace.',"\u7D2B\u7981\u57CE\u306E\u56DB\u9685\u306B1\u57FA\u305A\u3064\u5EFA\u3064\u3002\u4E09\u91CD\u306E\u8ED2\u3001\u5341\u5B57\u306E\u68DF\u3001\u56DB\u9762\u306B\u898B\u305B\u305F\u7834\u98A8\u304B\u3089\u3001\u4FD7\u306B\u300C\u4E5D\u6881\u5341\u516B\u67F1\u4E03\u5341\u4E8C\u6761\u810A\u300D\u3068\u79F0\u3055\u308C\u3001\u6545\u5BAE\u3067\u6700\u3082\u7CBE\u5DE7\u306A\u6728\u9020\u5EFA\u7BC9\u306E\u4E00\u3064\u3002",'\uC790\uAE08\uC131 \uB124 \uBAA8\uC11C\uB9AC\uC5D0 \uD558\uB098\uC529 \uC11C \uC788\uB2E4. \uC138 \uACB9 \uCC98\uB9C8, \uC2ED\uC790 \uC6A9\uB9C8\uB8E8, \uC0AC\uBC29\uC758 \uBC15\uACF5\uC73C\uB85C \uBBFC\uAC04\uC5D0\uC11C\uB294 "\uB4E4\uBCF4 \uC544\uD649, \uAE30\uB465 \uC5F4\uC5EC\uB35F, \uC6A9\uB9C8\uB8E8 \uC77C\uD754\uB458"\uC774\uB77C \uBD88\uB800\uC73C\uBA70, \uACE0\uAD81\uC5D0\uC11C \uAC00\uC7A5 \uC815\uAD50\uD55C \uBAA9\uC870 \uAC74\uCD95 \uAC00\uC6B4\uB370 \uD558\uB098\uB2E4.'],Ut=['A double-eaved pavilion with porches projecting on four sides, round above and square below, after the idea that "heaven is round and earth is square". Wanchun (east) and Qianqiu (west) face each other, standing for spring and autumn.',"\u56DB\u65B9\u306B\u62B1\u53A6\u3092\u5F35\u308A\u51FA\u3057\u305F\u91CD\u6A90\u306E\u4EAD\u3067\u3001\u4E0A\u304C\u5186\u304F\u4E0B\u304C\u65B9\u5F62\u3001\u300C\u5929\u5186\u5730\u65B9\u300D\u3092\u8868\u3059\u3002\u6771\u306E\u4E07\u6625\u4EAD\u3068\u897F\u306E\u5343\u79CB\u4EAD\u304C\u5411\u304B\u3044\u5408\u3044\u3001\u6625\u3068\u79CB\u3092\u8C61\u5FB4\u3059\u308B\u3002",'\uB124 \uBC29\uD5A5\uC73C\uB85C \uD3EC\uD558\uB97C \uB0B4\uBBFC \uACB9\uCC98\uB9C8 \uC815\uC790\uB85C, \uC704\uB294 \uB465\uAE00\uACE0 \uC544\uB798\uB294 \uB124\uBAA8\uB098 "\uD558\uB298\uC740 \uB465\uAE00\uACE0 \uB545\uC740 \uB124\uBAA8\uB098\uB2E4"\uB294 \uB73B\uC744 \uB2F4\uC558\uB2E4. \uB3D9\uCABD \uB9CC\uCD98\uC815\uACFC \uC11C\uCABD \uCC9C\uCD94\uC815\uC774 \uB9C8\uC8FC \uBCF4\uBA70 \uBD04\uACFC \uAC00\uC744\uC744 \uC0C1\uC9D5\uD55C\uB2E4.'],Qt=["Di'anmen was the north gate of the Imperial City, facing Tian'anmen across the palace; it was demolished in 1954. The wing buildings inside it were rebuilt to their original appearance around 2014 and mark the northern edge of the Imperial City.","\u5730\u5B89\u9580\u306F\u7687\u57CE\u306E\u5317\u9580\u3067\u5929\u5B89\u9580\u3068\u5357\u5317\u306B\u5411\u304D\u5408\u3063\u3066\u3044\u305F\u304C\u30011954\u5E74\u306B\u64A4\u53BB\u3055\u308C\u305F\u3002\u9580\u5185\u4E21\u5074\u306E\u96C1\u7FC5\u697C\u306F2014\u5E74\u524D\u5F8C\u306B\u65E7\u72B6\u3069\u304A\u308A\u518D\u5EFA\u3055\u308C\u3001\u7687\u57CE\u306E\u5317\u8FBA\u3092\u793A\u3057\u3066\u3044\u308B\u3002","\uC9C0\uC548\uBB38\uC740 \uD669\uC131\uC758 \uBD81\uBB38\uC73C\uB85C \uD188\uC548\uBA3C\uACFC \uB0A8\uBD81\uC73C\uB85C \uB9C8\uC8FC\uD588\uC73C\uB098 1954\uB144\uC5D0 \uCCA0\uAC70\uB418\uC5C8\uB2E4. \uBB38 \uC548 \uC591\uCABD\uC758 \uC548\uC2DC\uB8E8\uB294 2014\uB144 \uBB34\uB835 \uC61B \uBAA8\uC2B5\uB300\uB85C \uBCF5\uC6D0\uB418\uC5B4 \uD669\uC131\uC758 \uBD81\uCABD \uACBD\uACC4\uB97C \uBCF4\uC5EC \uC900\uB2E4."],Vt={\u5348\u95E8:['The main gate of the Forbidden City, U-shaped in plan. On the 12 m platform stands a nine-bay hall with a double-eaved hip roof; a thirteen-bay wing runs south on each side, ending in pavilions at the four corners, together called the "Five Phoenix Towers". The central passage was reserved for the emperor.',"\u7D2B\u7981\u57CE\u306E\u6B63\u9580\u3067\u3001\u5E73\u9762\u306F\u300C\u51F9\u300D\u5B57\u5F62\u3002\u57CE\u53F0\u4E0A\u306E\u6B63\u697C\u306F\u91CD\u6A90\u5EE1\u6BBF\u9802\u3001\u4E21\u7FFC\u306B\u5404\u5341\u4E09\u9593\u306E\u96C1\u7FC5\u697C\u304C\u5EF6\u3073\u3001\u56DB\u9685\u306B\u91CD\u6A90\u6522\u5C16\u306E\u95D5\u4EAD\u304C\u5EFA\u3061\u3001\u5408\u308F\u305B\u3066\u300C\u4E94\u9CF3\u697C\u300D\u3068\u547C\u3070\u308C\u308B\u3002\u4E2D\u592E\u306E\u9580\u306F\u7687\u5E1D\u5C02\u7528\u3002",'\uC790\uAE08\uC131\uC758 \uC815\uBB38\uC73C\uB85C \uD3C9\uBA74\uC774 "\u51F9" \uC790 \uBAA8\uC591\uC774\uB2E4. \uC131\uB300 \uC704 \uC815\uB8E8\uB294 \uACB9\uCC98\uB9C8 \uC6B0\uC9C4\uAC01\uC9C0\uBD95\uC774\uBA70, \uC591\uCABD \uB0A0\uAC1C\uC5D0 \uAC01 13\uCE78\uC758 \uC548\uC2DC\uB8E8\uAC00 \uBED7\uACE0 \uB124 \uBAA8\uC11C\uB9AC\uC5D0 \uACB9\uCC98\uB9C8 \uBAA8\uC784\uC9C0\uBD95\uC758 \uAD90\uC815\uC774 \uC788\uC5B4 \uD568\uAED8 "\uC624\uBD09\uB8E8"\uB77C \uBD80\uB978\uB2E4. \uAC00\uC6B4\uB370 \uBB38\uC740 \uD669\uC81C \uC804\uC6A9\uC774\uC5C8\uB2E4.'],\u5185\u91D1\u6C34\u6865:["The Inner Golden Water River bends like a bow across the courtyard before the Gate of Supreme Harmony. Five white-marble bridges cross it; the central Imperial Way bridge was for the emperor alone.","\u5185\u91D1\u6C34\u6CB3\u304C\u5F13\u306A\u308A\u306B\u592A\u548C\u9580\u524D\u306E\u5E83\u5834\u3092\u6A2A\u5207\u308A\u3001\u305D\u306E\u4E0A\u306B\u6F22\u767D\u7389\u306E\u77F3\u6A4B\u304C\u4E94\u57FA\u67B6\u304B\u308B\u3002\u4E2D\u592E\u306E\u5FA1\u8DEF\u6A4B\u306F\u7687\u5E1D\u5C02\u7528\u3002","\uB0B4\uAE08\uC218\uD558\uAC00 \uD65C \uBAA8\uC591\uC73C\uB85C \uD0DC\uD654\uBB38 \uC55E \uAD11\uC7A5\uC744 \uAC00\uB85C\uC9C0\uB974\uACE0, \uADF8 \uC704\uC5D0 \uD55C\uBC31\uC625 \uB3CC\uB2E4\uB9AC \uB2E4\uC12F\uC774 \uB193\uC5EC \uC788\uB2E4. \uAC00\uC6B4\uB370 \uC5B4\uB85C\uAD50\uB294 \uD669\uC81C \uC804\uC6A9\uC774\uC5C8\uB2E4."],\u592A\u548C\u95E8:['Main gate of the Outer Court and the largest gate inside the palace, with a double-eaved gable-and-hip roof on a white-marble base. Ming emperors held court here ("attending to government at the gate"). The present building was rebuilt in 1889.',"\u5916\u671D\u306E\u6B63\u9580\u3067\u3001\u5BAE\u57CE\u5185\u3067\u6700\u5927\u306E\u9580\u3002\u91CD\u6A90\u6B47\u5C71\u9802\u3067\u6F22\u767D\u7389\u306E\u9808\u5F25\u5EA7\u306B\u8F09\u308B\u3002\u660E\u4EE3\u306E\u7687\u5E1D\u306F\u3053\u3053\u3067\u300C\u5FA1\u9580\u8074\u653F\u300D\u3092\u884C\u3063\u305F\u3002\u73FE\u5B58\u306E\u5EFA\u7269\u306F\u5149\u7DD215\u5E74\uFF081889\uFF09\u306E\u518D\u5EFA\u3002",'\uC678\uC870\uC758 \uC815\uBB38\uC774\uC790 \uAD81 \uC548\uC5D0\uC11C \uAC00\uC7A5 \uD070 \uBB38\uC73C\uB85C, \uACB9\uCC98\uB9C8 \uD314\uC791\uC9C0\uBD95\uC774 \uD55C\uBC31\uC625 \uC218\uBBF8\uC88C \uC704\uC5D0 \uB193\uC5EC \uC788\uB2E4. \uBA85\uB098\uB77C \uD669\uC81C\uB4E4\uC774 \uC774\uACF3\uC5D0\uC11C "\uC5B4\uBB38\uCCAD\uC815"\uC744 \uD588\uB2E4. \uD604\uC874 \uAC74\uBB3C\uC740 1889\uB144\uC5D0 \uB2E4\uC2DC \uC9C0\uC740 \uAC83\uC774\uB2E4.'],\u4F53\u4EC1\u9601:["Two-storey pavilion on the east side of the Hall of Supreme Harmony courtyard, called the Literary Tower in the Ming. The Kangxi Emperor held a special examination for eminent scholars here; it later stored silk.","\u592A\u548C\u6BBF\u5E83\u5834\u306E\u6771\u5074\u306B\u5EFA\u3064\u4E8C\u5C64\u306E\u697C\u95A3\u3067\u3001\u660E\u4EE3\u306F\u6587\u697C\u3068\u547C\u3070\u308C\u305F\u3002\u6E05\u306E\u5EB7\u7199\u5E74\u9593\u306B\u535A\u5B66\u9D3B\u8A5E\u79D1\u306E\u8A66\u9A13\u304C\u884C\u308F\u308C\u3001\u306E\u3061\u7DDE\u5B50\u306E\u5009\u5EAB\u3068\u306A\u3063\u305F\u3002","\uD0DC\uD654\uC804 \uAD11\uC7A5 \uB3D9\uCABD\uC758 2\uCE35 \uB204\uAC01\uC73C\uB85C \uBA85\uB098\uB77C \uB54C\uB294 \uBB38\uB8E8\uB77C \uBD88\uB838\uB2E4. \uCCAD \uAC15\uD76C \uC5F0\uAC04\uC5D0 \uBC15\uD559\uD64D\uC0AC\uACFC \uC2DC\uD5D8\uC744 \uCE58\uB800\uACE0, \uB4A4\uC5D0 \uBE44\uB2E8 \uCC3D\uACE0\uAC00 \uB418\uC5C8\uB2E4."],\u5F18\u4E49\u9601:["Two-storey pavilion on the west side of the Hall of Supreme Harmony courtyard, called the Martial Tower in the Ming; in the Qing it was the silver vault of the Imperial Household Department.","\u592A\u548C\u6BBF\u5E83\u5834\u306E\u897F\u5074\u306B\u5EFA\u3064\u4E8C\u5C64\u306E\u697C\u95A3\u3067\u3001\u660E\u4EE3\u306F\u6B66\u697C\u3068\u547C\u3070\u308C\u3001\u6E05\u4EE3\u306F\u5185\u52D9\u5E9C\u306E\u9280\u5EAB\u3060\u3063\u305F\u3002","\uD0DC\uD654\uC804 \uAD11\uC7A5 \uC11C\uCABD\uC758 2\uCE35 \uB204\uAC01\uC73C\uB85C \uBA85\uB098\uB77C \uB54C\uB294 \uBB34\uB8E8\uB77C \uBD88\uB838\uACE0, \uCCAD\uB098\uB77C \uB54C\uB294 \uB0B4\uBB34\uBD80\uC758 \uC740\uACE0\uC600\uB2E4."],\u4E09\u53F0:['The shared base of the Three Great Halls: three stacked tiers ringed by balustrades, posts and over a thousand dragon-head spouts, which pour water in a rainstorm, the sight known as "a thousand dragons spitting water".',"\u4E09\u5927\u6BBF\u5171\u901A\u306E\u57FA\u58C7\u3067\u4E09\u5C64\u306B\u91CD\u306A\u308A\u3001\u6B04\u5E72\u30FB\u671B\u67F1\u3068\u5343\u4F59\u308A\u306E\u87AD\u9996\uFF08\u6392\u6C34\u53E3\uFF09\u304C\u5DE1\u308B\u3002\u96E8\u306E\u65E5\u306B\u306F\u300C\u5343\u9F8D\u5410\u6C34\u300D\u306E\u5149\u666F\u304C\u898B\u3089\u308C\u308B\u3002",'\uC0BC\uB300\uC804\uC774 \uD568\uAED8 \uC62C\uB77C\uC549\uC740 \uAE30\uB2E8\uC73C\uB85C \uC138 \uCE35\uC774 \uACB9\uCCD0 \uC788\uACE0, \uB09C\uAC04\xB7\uB9DD\uC8FC\uC640 \uCC9C\uC5EC \uAC1C\uC758 \uC774\uC218(\uBC30\uC218\uAD6C)\uAC00 \uB458\uB7EC \uC788\uB2E4. \uBE44 \uC624\uB294 \uB0A0\uC5D0\uB294 "\uCC9C \uB9C8\uB9AC \uC6A9\uC774 \uBB3C\uC744 \uBFDC\uB294" \uAD11\uACBD\uC744 \uBCFC \uC218 \uC788\uB2E4.'],\u592A\u548C\u6BBF:[`Popularly the "Hall of the Golden Throne", the largest surviving timber hall in China, under a double-eaved hip roof, the highest rank of roof. Enthronements, imperial weddings, the naming of empresses, the dispatch of generals and the New Year, Winter Solstice and imperial birthday rites were held here. Six gilded dragon columns surround the lacquered dragon throne, beneath Qianlong's plaque "Establish the Ultimate, Pacify the Realm" (\u5EFA\u6781\u7EE5\u7337). Rebuilt in 1695.`,"\u4FD7\u306B\u300C\u91D1\u947E\u6BBF\u300D\u3068\u547C\u3070\u308C\u3001\u4E2D\u56FD\u306B\u73FE\u5B58\u3059\u308B\u6700\u5927\u306E\u6728\u9020\u6BBF\u5802\u3002\u6700\u9AD8\u683C\u5F0F\u306E\u91CD\u6A90\u5EE1\u6BBF\u9802\u3092\u3082\u3064\u3002\u5373\u4F4D\u3001\u5927\u5A5A\u3001\u7687\u540E\u518A\u7ACB\u3001\u51FA\u5F81\u547D\u4EE4\u3001\u5143\u65E6\u30FB\u51AC\u81F3\u30FB\u4E07\u5BFF\u7BC0\u306E\u5100\u5F0F\u304C\u3053\u3053\u3067\u884C\u308F\u308C\u305F\u3002\u6BBF\u5185\u3067\u306F\u87E0\u9F8D\u3092\u5DFB\u3044\u305F6\u672C\u306E\u91D1\u67F1\u304C\u91D1\u6F06\u96F2\u9F8D\u306E\u7389\u5EA7\u3092\u56F2\u307F\u3001\u4E7E\u9686\u5E1D\u7B46\u306E\u300C\u5EFA\u6975\u7D8F\u7337\u300D\u306E\u6241\u984D\u304C\u639B\u304B\u308B\u3002\u73FE\u5B58\u5EFA\u7269\u306F\u5EB7\u719934\u5E74\uFF081695\uFF09\u306E\u518D\u5EFA\u3002",'\uD754\uD788 "\uAE08\uB780\uC804"\uC774\uB77C \uBD88\uB9AC\uBA70 \uC911\uAD6D\uC5D0 \uB0A8\uC544 \uC788\uB294 \uAC00\uC7A5 \uD070 \uBAA9\uC870 \uC804\uAC01\uC73C\uB85C, \uCD5C\uACE0 \uB4F1\uAE09\uC778 \uACB9\uCC98\uB9C8 \uC6B0\uC9C4\uAC01\uC9C0\uBD95\uC744 \uC5B9\uC5C8\uB2E4. \uC989\uC704, \uB300\uD63C, \uD669\uD6C4 \uCC45\uBD09, \uCD9C\uC815 \uBA85\uB839\uACFC \uC6D0\uB2E8\xB7\uB3D9\uC9C0\xB7\uB9CC\uC218\uC808 \uC758\uC2DD\uC774 \uC774\uACF3\uC5D0\uC11C \uC5F4\uB838\uB2E4. \uC804\uAC01 \uC548\uC5D0\uB294 \uC6A9\uC744 \uAC10\uC740 \uAE08\uAE30\uB465 \uC5EC\uC12F \uAC1C\uAC00 \uAE08\uCE60 \uC6B4\uB8E1 \uBCF4\uC88C\uB97C \uB458\uB7EC\uC2F8\uACE0, \uADF8 \uC704\uC5D0 \uAC74\uB96D\uC81C\uAC00 \uC4F4 "\uAC74\uADF9\uC218\uC720(\u5EFA\u6975\u7D8F\u7337)" \uD604\uD310\uC774 \uAC78\uB824 \uC788\uB2E4. \uD604\uC874 \uAC74\uBB3C\uC740 1695\uB144\uC5D0 \uB2E4\uC2DC \uC9C0\uC5C8\uB2E4.'],\u4E2D\u548C\u6BBF:[`Single-eaved pyramidal roof with a gilded finial. The emperor rested here before ceremonies in the Hall of Supreme Harmony, received officials in charge, and reviewed sacrificial texts. Inside hangs Qianlong's plaque "Hold Fast to the Middle Way" (\u5141\u6267\u53A5\u4E2D).`,"\u5358\u6A90\u306E\u56DB\u89D2\u6522\u5C16\u9802\u3067\u3001\u9802\u90E8\u306B\u934D\u91D1\u306E\u5B9D\u9802\u3092\u8F09\u305B\u308B\u3002\u7687\u5E1D\u306F\u592A\u548C\u6BBF\u306E\u5927\u5178\u306E\u524D\u306B\u3053\u3053\u3067\u4F11\u307F\u3001\u57F7\u4E8B\u306E\u5B98\u54E1\u306E\u62DD\u793C\u3092\u53D7\u3051\u3001\u796D\u6587\u3092\u95B2\u3057\u305F\u3002\u6BBF\u5185\u306B\u306F\u4E7E\u9686\u5E1D\u7B46\u306E\u300C\u5141\u57F7\u53A5\u4E2D\u300D\u306E\u6241\u984D\u304C\u639B\u304B\u308B\u3002",'\uD651\uCC98\uB9C8 \uC0AC\uBAA8 \uBAA8\uC784\uC9C0\uBD95\uC5D0 \uAE08\uB3C4\uAE08 \uBCF4\uC815\uC744 \uC5B9\uC5C8\uB2E4. \uD669\uC81C\uB294 \uD0DC\uD654\uC804 \uB300\uC804 \uC804\uC5D0 \uC774\uACF3\uC5D0\uC11C \uC26C\uBA70 \uB2F4\uB2F9 \uAD00\uC6D0\uC758 \uBC30\uB840\uB97C \uBC1B\uACE0 \uC81C\uBB38\uC744 \uC0B4\uD3C8\uB2E4. \uC548\uC5D0\uB294 \uAC74\uB96D\uC81C\uAC00 \uC4F4 "\uC724\uC9D1\uAD90\uC911(\u5141\u57F7\u53A5\u4E2D)" \uD604\uD310\uC774 \uAC78\uB824 \uC788\uB2E4.'],\u4FDD\u548C\u6BBF:["Double-eaved gable-and-hip roof. In the Qing, banquets for princes of the outer territories were held here on New Year's Eve and the Lantern Festival, and from late in Qianlong's reign the palace examination took place here. The cloud-and-dragon stone carving behind it, 16.57 m long and over 200 tonnes, is the largest stone carving in the palace.","\u91CD\u6A90\u6B47\u5C71\u9802\u3002\u6E05\u4EE3\u306B\u306F\u6BCE\u5E74\u5927\u6666\u65E5\u3068\u5143\u5BB5\u7BC0\u306B\u5916\u85E9\u306E\u738B\u516C\u3092\u3053\u3053\u3067\u9957\u5FDC\u3057\u3001\u4E7E\u9686\u5F8C\u671F\u304B\u3089\u306F\u6BBF\u8A66\u3082\u884C\u308F\u308C\u305F\u3002\u6BBF\u306E\u5F8C\u308D\u306B\u3042\u308B\u96F2\u9F8D\u306E\u5927\u77F3\u5F6B\u306F\u9577\u305516.57m\u3001\u91CD\u3055200\u30C8\u30F3\u4F59\u308A\u3067\u3001\u5BAE\u4E2D\u6700\u5927\u306E\u77F3\u5F6B\u3002","\uACB9\uCC98\uB9C8 \uD314\uC791\uC9C0\uBD95\uC774\uB2E4. \uCCAD\uB098\uB77C \uB54C \uD574\uB9C8\uB2E4 \uC123\uB2EC \uADF8\uBBD0\uACFC \uC6D0\uC18C\uC808\uC5D0 \uC678\uBC88 \uC655\uACF5\uC744 \uC774\uACF3\uC5D0\uC11C \uB300\uC811\uD588\uACE0, \uAC74\uB96D \uD6C4\uAE30\uBD80\uD130\uB294 \uC804\uC2DC\uB97C \uC774\uACF3\uC5D0\uC11C \uCE58\uB800\uB2E4. \uC804\uAC01 \uB4A4\uC758 \uC6B4\uB8E1 \uB300\uC11D\uC870\uB294 \uAE38\uC774 16.57m, \uBB34\uAC8C 200\uD1A4\uC774 \uB118\uC5B4 \uAD81 \uC548\uC5D0\uC11C \uAC00\uC7A5 \uD070 \uC11D\uC870\uBB3C\uC774\uB2E4."],\u4E7E\u6E05\u95E8:["Main gate of the Inner Court, dividing it from the Outer Court. Kangxi and other Qing emperors held court here. A pair of gilt bronze lions stands in front, flanked by splayed glazed screen walls.","\u5185\u5EF7\u306E\u6B63\u9580\u3067\u3001\u5916\u671D\u3068\u5185\u5EF7\u306E\u5883\u3002\u6E05\u306E\u5EB7\u7199\u5E1D\u3089\u306F\u3053\u3053\u3067\u300C\u5FA1\u9580\u8074\u653F\u300D\u3092\u884C\u3063\u305F\u3002\u9580\u524D\u306B\u934D\u91D1\u306E\u9285\u7345\u5B50\u4E00\u5BFE\u3001\u4E21\u5074\u306B\u516B\u306E\u5B57\u5F62\u306E\u7460\u7483\u5F71\u58C1\u304C\u3042\u308B\u3002",'\uB0B4\uC815\uC758 \uC815\uBB38\uC774\uC790 \uC678\uC870\uC640 \uB0B4\uC815\uC758 \uACBD\uACC4\uB2E4. \uAC15\uD76C\uC81C \uB4F1 \uCCAD \uD669\uC81C\uB4E4\uC774 \uC774\uACF3\uC5D0\uC11C "\uC5B4\uBB38\uCCAD\uC815"\uC744 \uD588\uB2E4. \uBB38 \uC55E\uC5D0 \uAE08\uB3C4\uAE08 \uCCAD\uB3D9 \uC0AC\uC790 \uD55C \uC30D\uC774 \uC788\uACE0, \uC591\uC606\uC5D0 \uD314(\u516B) \uC790 \uBAA8\uC591 \uC720\uB9AC \uC601\uBCBD\uC774 \uC788\uB2E4.'],\u519B\u673A\u5904:["Set up under the Yongzheng Emperor, the Grand Council was the nerve centre that advised the emperor on military and state affairs. Its duty rooms stand close to the Gate of Exalted Ancestry and the Hall of Mental Cultivation and are strikingly plain.","\u96CD\u6B63\u5E74\u9593\u306B\u8A2D\u3051\u3089\u308C\u305F\u3001\u7687\u5E1D\u306E\u8ECD\u653F\u3092\u88DC\u4F50\u3059\u308B\u4E2D\u67A2\u6A5F\u95A2\u3002\u8A70\u6240\u306F\u9686\u5B97\u9580\u3068\u990A\u5FC3\u6BBF\u306E\u3059\u3050\u305D\u3070\u306B\u3042\u308A\u3001\u5EFA\u7269\u306F\u304D\u308F\u3081\u3066\u8CEA\u7D20\u3002","\uC639\uC815 \uC5F0\uAC04\uC5D0 \uC124\uCE58\uB418\uC5B4 \uD669\uC81C\uC758 \uAD70\uC0AC\xB7\uC815\uBB34\uB97C \uBCF4\uC88C\uD55C \uC911\uCD94 \uAE30\uAD00\uC774\uB2E4. \uC219\uC9C1\uC18C\uB294 \uC735\uC885\uBB38\uACFC \uC591\uC2EC\uC804 \uBC14\uB85C \uACC1\uC5D0 \uC788\uC73C\uBA70 \uAC74\uBB3C\uC740 \uB9E4\uC6B0 \uC18C\uBC15\uD558\uB2E4."],\u4E7E\u6E05\u5BAB:[`Residence of the Ming and early Qing emperors; after Yongzheng moved to the Hall of Mental Cultivation it was used for audiences and banquets. Above the throne hangs Shunzhi's plaque "Upright and Bright" (\u6B63\u5927\u5149\u660E); the box naming the secretly chosen heir was kept behind it.`,"\u660E\u4EE3\u3068\u6E05\u521D\u306E\u7687\u5E1D\u306E\u5BDD\u5BAE\u3067\u3001\u96CD\u6B63\u5E1D\u304C\u990A\u5FC3\u6BBF\u3078\u79FB\u3063\u3066\u304B\u3089\u306F\u653F\u52D9\u30FB\u8B01\u898B\u30FB\u5BB4\u4F1A\u306E\u5834\u3068\u306A\u3063\u305F\u3002\u7389\u5EA7\u306E\u4E0A\u306B\u9806\u6CBB\u5E1D\u7B46\u306E\u300C\u6B63\u5927\u5149\u660E\u300D\u306E\u6241\u984D\u304C\u639B\u304B\u308A\u3001\u6E05\u4EE3\u306E\u79D8\u5BC6\u7ACB\u5132\u306E\u7BB1\u306F\u305D\u306E\u88CF\u306B\u7D0D\u3081\u3089\u308C\u305F\u3002",'\uBA85\uB098\uB77C\uC640 \uCCAD\uB098\uB77C \uCD08\uAE30 \uD669\uC81C\uC758 \uCE68\uAD81\uC774\uC5C8\uACE0, \uC639\uC815\uC81C\uAC00 \uC591\uC2EC\uC804\uC73C\uB85C \uC62E\uAE34 \uB4A4\uC5D0\uB294 \uC815\uBB34\xB7\uC811\uACAC\xB7\uC5F0\uD68C\uC758 \uC7A5\uC18C\uAC00 \uB418\uC5C8\uB2E4. \uBCF4\uC88C \uC704\uC5D0 \uC21C\uCE58\uC81C\uAC00 \uC4F4 "\uC815\uB300\uAD11\uBA85(\u6B63\u5927\u5149\u660E)" \uD604\uD310\uC774 \uAC78\uB824 \uC788\uACE0, \uBE44\uBC00 \uD6C4\uACC4\uC790 \uC9C0\uBA85 \uC0C1\uC790\uAC00 \uADF8 \uB4A4\uC5D0 \uBCF4\uAD00\uB418\uC5C8\uB2E4.'],\u4EA4\u6CF0\u6BBF:[`Named for the union of heaven and earth, it resembles the Hall of Central Harmony but is smaller. The empress received birthday congratulations here, and from 1748 the 25 imperial seals of the Qing were kept here. Inside are Kangxi's plaque "Non-action" (\u65E0\u4E3A), a water clock and a large chiming clock.`,"\u300C\u5929\u5730\u4EA4\u6CF0\u300D\u306B\u56E0\u3080\u540D\u3067\u3001\u5F62\u306F\u4E2D\u548C\u6BBF\u306B\u4F3C\u3066\u4E00\u56DE\u308A\u5C0F\u3055\u3044\u3002\u7687\u540E\u306E\u8A95\u751F\u65E5\u306E\u795D\u8CC0\u304C\u3053\u3053\u3067\u884C\u308F\u308C\u3001\u4E7E\u968613\u5E74\u304B\u3089\u6E05\u671D\u306E\u5B9D\u74BD25\u65B9\u304C\u53CE\u3081\u3089\u308C\u305F\u3002\u6BBF\u5185\u306B\u306F\u5EB7\u7199\u5E1D\u7B46\u306E\u300C\u7121\u70BA\u300D\u306E\u6241\u984D\u3001\u9285\u58FA\u6EF4\u6F0F\u3068\u5927\u81EA\u9CF4\u9418\u304C\u7F6E\u304B\u308C\u308B\u3002",'"\uCC9C\uC9C0\uAD50\uD0DC"\uC5D0\uC11C \uC774\uB984\uC744 \uB530\uC654\uC73C\uBA70 \uC911\uD654\uC804\uACFC \uBE44\uC2B7\uD558\uC9C0\uB9CC \uC870\uAE08 \uC791\uB2E4. \uD669\uD6C4\uC758 \uC0DD\uC77C \uD558\uB840\uB97C \uC774\uACF3\uC5D0\uC11C \uBC1B\uC558\uACE0, 1748\uB144\uBD80\uD130 \uCCAD\uB098\uB77C \uC625\uC0C8 25\uBC29\uC744 \uBCF4\uAD00\uD588\uB2E4. \uC548\uC5D0\uB294 \uAC15\uD76C\uC81C\uAC00 \uC4F4 "\uBB34\uC704(\u7121\u70BA)" \uD604\uD310\uACFC \uBB3C\uC2DC\uACC4, \uD070 \uC790\uBA85\uC885\uC774 \uC788\uB2E4.'],\u5764\u5B81\u5BAB:["The empress's residence in the Ming. The Qing rebuilt it after Manchu custom: the west part became a shamanic shrine and the east chamber the bridal room for imperial weddings; Kangxi, Tongzhi and Guangxu were all married here.","\u660E\u4EE3\u306E\u7687\u540E\u306E\u5BDD\u5BAE\u3002\u6E05\u4EE3\u306B\u6E80\u6D32\u65CF\u306E\u7FD2\u4FD7\u306B\u5F93\u3063\u3066\u6539\u7BC9\u3055\u308C\u3001\u897F\u5074\u306F\u30B7\u30E3\u30FC\u30DE\u30F3\u306E\u796D\u795E\u306E\u5834\u3001\u6771\u6696\u95A3\u306F\u7687\u5E1D\u306E\u5A5A\u793C\u306E\u9593\u3068\u306A\u308A\u3001\u5EB7\u7199\u30FB\u540C\u6CBB\u30FB\u5149\u7DD2\u306E\u5404\u5E1D\u304C\u3053\u3053\u3067\u6210\u5A5A\u3057\u305F\u3002","\uBA85\uB098\uB77C \uD669\uD6C4\uC758 \uCE68\uAD81\uC774\uC5C8\uB2E4. \uCCAD\uB098\uB77C \uB54C \uB9CC\uC8FC\uC871 \uD48D\uC2B5\uC5D0 \uB530\uB77C \uACE0\uCCD0 \uC9C0\uC5B4 \uC11C\uCABD\uC740 \uC0E4\uBA38\uB2C8\uC998 \uC81C\uC0AC \uACF5\uAC04, \uB3D9\uB09C\uAC01\uC740 \uD669\uC81C\uC758 \uC2E0\uBC29\uC774 \uB418\uC5C8\uC73C\uBA70 \uAC15\uD76C\xB7\uB3D9\uCE58\xB7\uAD11\uC11C\uC81C\uAC00 \uBAA8\uB450 \uC774\uACF3\uC5D0\uC11C \uD63C\uB840\uB97C \uC62C\uB838\uB2E4."],\u94A6\u5B89\u6BBF:["Centre of the Imperial Garden, dedicated to the Taoist deity Xuantian Shangdi (Zhenwu). An original Ming building with a rare double-eaved flat-topped (lu) roof crowned by a gilded finial.","\u5FA1\u82B1\u5712\u306E\u4E2D\u5FC3\u5EFA\u7BC9\u3067\u3001\u9053\u6559\u306E\u7384\u5929\u4E0A\u5E1D\uFF08\u771F\u6B66\u5927\u5E1D\uFF09\u3092\u7940\u308B\u3002\u660E\u4EE3\u306E\u539F\u69CB\u3067\u3001\u73CD\u3057\u3044\u91CD\u6A90\u76DD\u9802\u306E\u4E0A\u306B\u934D\u91D1\u306E\u5B9D\u9802\u3092\u8F09\u305B\u308B\u3002","\uC5B4\uD654\uC6D0\uC758 \uC911\uC2EC \uAC74\uBB3C\uB85C \uB3C4\uAD50\uC758 \uD604\uCC9C\uC0C1\uC81C(\uC9C4\uBB34\uB300\uC81C)\uB97C \uBAA8\uC2E0\uB2E4. \uBA85\uB098\uB77C \uB54C \uC6D0\uB798 \uAC74\uBB3C\uC774\uBA70, \uBCF4\uAE30 \uB4DC\uBB38 \uACB9\uCC98\uB9C8 \uB179\uC815\uC9C0\uBD95 \uC704\uC5D0 \uAE08\uB3C4\uAE08 \uBCF4\uC815\uC744 \uC5B9\uC5C8\uB2E4."],\u4E07\u6625\u4EAD:Ut,\u5343\u79CB\u4EAD:Ut,"\u5806\u79C0\u5C71 \xB7 \u5FA1\u666F\u4EAD":["A rockery of Taihu stone. From the Imperial View Pavilion on top, the emperor and empress climbed for the Double Ninth Festival and looked out over the palace to Jingshan.","\u592A\u6E56\u77F3\u3092\u7A4D\u307F\u4E0A\u3052\u305F\u7BC9\u5C71\u3002\u5C71\u9802\u306E\u5FA1\u666F\u4EAD\u306F\u5E1D\u540E\u304C\u91CD\u967D\u7BC0\u306B\u767B\u9AD8\u3057\u305F\u5834\u6240\u3067\u3001\u5BAE\u82D1\u3092\u898B\u4E0B\u308D\u3057\u666F\u5C71\u3092\u671B\u3081\u308B\u3002","\uD0DC\uD638\uC11D\uC744 \uC313\uC740 \uAC00\uC0B0\uC774\uB2E4. \uAF2D\uB300\uAE30 \uC5B4\uACBD\uC815\uC740 \uD669\uC81C\uC640 \uD669\uD6C4\uAC00 \uC911\uC591\uC808\uC5D0 \uB192\uC740 \uACF3\uC5D0 \uC624\uB974\uB358 \uACF3\uC73C\uB85C, \uAD81\uC6D0\uC744 \uB0B4\uB824\uB2E4\uBCF4\uACE0 \uC9D5\uC0B0\uC744 \uBC14\uB77C\uBCFC \uC218 \uC788\uB2E4."],\u5FA1\u82B1\u56ED:["Begun under Yongle at the north end of the palace axis. Over twenty pavilions and halls are laid out symmetrically around the Hall of Imperial Peace, among ancient cypresses, wisteria, rare rocks and pebble mosaics.","\u660E\u306E\u6C38\u697D\u5E74\u9593\u306B\u9020\u55B6\u304C\u59CB\u307E\u308A\u3001\u4E2D\u8EF8\u7DDA\u306E\u5317\u7AEF\u306B\u4F4D\u7F6E\u3059\u308B\u3002\u6B3D\u5B89\u6BBF\u3092\u4E2D\u5FC3\u306B\u4E8C\u5341\u4F59\u308A\u306E\u4EAD\u53F0\u697C\u95A3\u304C\u5BFE\u79F0\u306B\u914D\u3055\u308C\u3001\u53E4\u3044\u67CF\u3001\u85E4\u3001\u5947\u77F3\u3001\u5C0F\u77F3\u306E\u8217\u9053\u753B\u304C\u914D\u3055\u308C\u308B\u3002","\uBA85\uB098\uB77C \uC601\uB77D \uC5F0\uAC04\uC5D0 \uCC98\uC74C \uC9C0\uC5C8\uC73C\uBA70 \uC911\uCD95\uC120 \uBD81\uB2E8\uC5D0 \uC788\uB2E4. \uD760\uC548\uC804\uC744 \uC911\uC2EC\uC73C\uB85C \uC815\uC790\uC640 \uB204\uAC01 \uC2A4\uBB34\uC5EC \uCC44\uAC00 \uB300\uCE6D\uC73C\uB85C \uB193\uC774\uACE0, \uC0AC\uC774\uC0AC\uC774\uC5D0 \uC624\uB798\uB41C \uCE21\uBC31\uB098\uBB34, \uB4F1\uB098\uBB34, \uAE30\uC554\uAD34\uC11D, \uC790\uAC08 \uBC14\uB2E5 \uADF8\uB9BC\uC774 \uC788\uB2E4."],\u795E\u6B66\u95E8:["North gate of the Forbidden City, called Xuanwumen in the Ming and renamed under Kangxi to avoid his personal name. Its tower held a bell and drum for marking the night watches; candidate consorts entered through it. Today it is the museum's exit, facing Jingshan.","\u7D2B\u7981\u57CE\u306E\u5317\u9580\u3002\u660E\u4EE3\u306F\u7384\u6B66\u9580\u3068\u547C\u3070\u308C\u3001\u6E05\u4EE3\u306B\u5EB7\u7199\u5E1D\u306E\u8AF1\u3092\u907F\u3051\u3066\u300C\u795E\u6B66\u9580\u300D\u3068\u6539\u3081\u305F\u3002\u57CE\u697C\u306B\u306F\u9418\u3068\u592A\u9F13\u304C\u3042\u308A\u66F4\u3092\u544A\u3052\u305F\u3002\u6E05\u4EE3\u306E\u79C0\u5973\u9078\u3073\u3067\u306F\u3053\u306E\u9580\u304B\u3089\u51FA\u5165\u308A\u3057\u305F\u3002\u73FE\u5728\u306F\u6545\u5BAE\u535A\u7269\u9662\u306E\u51FA\u53E3\u3067\u3001\u666F\u5C71\u3068\u5411\u304D\u5408\u3046\u3002",'\uC790\uAE08\uC131\uC758 \uBD81\uBB38\uC774\uB2E4. \uBA85\uB098\uB77C \uB54C\uB294 \uD604\uBB34\uBB38\uC774\uB77C \uD588\uC73C\uB098 \uCCAD\uB098\uB77C \uB54C \uAC15\uD76C\uC81C\uC758 \uC774\uB984\uC744 \uD53C\uD574 "\uC2E0\uBB34\uBB38"\uC73C\uB85C \uBC14\uAFB8\uC5C8\uB2E4. \uC131\uB8E8\uC5D0 \uC885\uACFC \uBD81\uC744 \uB450\uC5B4 \uBC24 \uC2DC\uAC01\uC744 \uC54C\uB838\uACE0, \uCCAD\uB098\uB77C \uC218\uB140 \uC120\uBC1C \uB54C \uC774 \uBB38\uC73C\uB85C \uB4DC\uB098\uB4E4\uC5C8\uB2E4. \uC9C0\uAE08\uC740 \uACE0\uAD81\uBC15\uBB3C\uC6D0\uC758 \uCD9C\uAD6C\uB85C \uC9D5\uC0B0\uACFC \uB9C8\uC8FC\uD55C\uB2E4.'],\u4E1C\u534E\u95E8:["East gate of the Forbidden City. Its door studs run eight rows of nine, 72 in all, unlike the nine-by-nine of the other gates. The coffins of deceased Qing emperors and empresses left the palace through it.","\u7D2B\u7981\u57CE\u306E\u6771\u9580\u3002\u9580\u91D8\u306F\u516B\u5217\u4E5D\u500B\u306E\u8A0872\u3067\u3001\u4ED6\u306E\u4E09\u9580\u306E\u4E5D\u5217\u4E5D\u500B\u3068\u7570\u306A\u308B\u3002\u6E05\u4EE3\u306B\u306F\u5D29\u5FA1\u3057\u305F\u7687\u5E1D\u30FB\u7687\u540E\u306E\u68FA\u304C\u3053\u306E\u9580\u304B\u3089\u51FA\u3055\u308C\u305F\u3002","\uC790\uAE08\uC131\uC758 \uB3D9\uBB38\uC774\uB2E4. \uBB38\uBABB\uC774 \uC5EC\uB35F \uC904\uC5D0 \uC544\uD649 \uAC1C\uC529 \uBAA8\uB450 72\uAC1C\uB85C, \uB2E4\uB978 \uC138 \uBB38\uC758 \uC544\uD649 \uC904 \uC544\uD649 \uAC1C\uC640 \uB2E4\uB974\uB2E4. \uCCAD\uB098\uB77C \uB54C \uBD95\uC5B4\uD55C \uD669\uC81C\uC640 \uD669\uD6C4\uC758 \uAD00\uC774 \uC774 \uBB38\uC73C\uB85C \uB098\uAC14\uB2E4."],\u897F\u534E\u95E8:["West gate of the Forbidden City, of the same form as the East Glorious Gate. Qing emperors and empresses usually left through it for the Western Garden and the Old Summer Palace.","\u7D2B\u7981\u57CE\u306E\u897F\u9580\u3067\u3001\u5F62\u5F0F\u306F\u6771\u83EF\u9580\u3068\u540C\u3058\u3002\u6E05\u4EE3\u306E\u5E1D\u540E\u304C\u897F\u82D1\u3084\u5186\u660E\u5712\u3078\u8D74\u304F\u969B\u306F\u591A\u304F\u3053\u306E\u9580\u3092\u901A\u3063\u305F\u3002","\uC790\uAE08\uC131\uC758 \uC11C\uBB38\uC73C\uB85C \uD615\uC2DD\uC740 \uB3D9\uD654\uBB38\uACFC \uAC19\uB2E4. \uCCAD\uB098\uB77C \uD669\uC81C\uC640 \uD669\uD6C4\uAC00 \uC11C\uC6D0\uC774\uB098 \uC6D0\uBA85\uC6D0\uC73C\uB85C \uAC08 \uB54C \uC8FC\uB85C \uC774 \uBB38\uC744 \uC9C0\uB0AC\uB2E4."],\u4E1C\u5317\u89D2\u697C:bt,\u897F\u5317\u89D2\u697C:bt,\u4E1C\u5357\u89D2\u697C:bt,\u897F\u5357\u89D2\u697C:bt,\u6587\u534E\u6BBF:["Once where the Ming crown prince attended to affairs, later the hall for imperial lectures on the classics. The Pavilion of Literary Profundity stands behind it. Today it houses the museum's ceramics gallery.","\u660E\u4EE3\u306B\u306F\u7687\u592A\u5B50\u306E\u57F7\u52D9\u306E\u5834\u3001\u306E\u3061\u306B\u7687\u5E1D\u304C\u7D4C\u66F8\u306E\u8B1B\u7FA9\u3092\u53D7\u3051\u308B\u7D4C\u7B75\u306E\u5834\u3068\u306A\u3063\u305F\u3002\u6BBF\u306E\u5F8C\u308D\u306B\u6587\u6DF5\u95A3\u304C\u3042\u308B\u3002\u73FE\u5728\u306F\u6545\u5BAE\u535A\u7269\u9662\u306E\u9676\u78C1\u9928\u3002","\uBA85\uB098\uB77C \uB54C \uD0DC\uC790\uAC00 \uC815\uBB34\uB97C \uBCF4\uB358 \uACF3\uC774\uC5C8\uACE0, \uB4A4\uC5D0 \uD669\uC81C\uAC00 \uACBD\uC804 \uAC15\uC758\uB97C \uB4E3\uB294 \uACBD\uC5F0\uC758 \uC7A5\uC18C\uAC00 \uB418\uC5C8\uB2E4. \uB4A4\uD3B8\uC5D0 \uBB38\uC5F0\uAC01\uC774 \uC788\uB2E4. \uC9C0\uAE08\uC740 \uACE0\uAD81\uBC15\uBB3C\uC6D0 \uB3C4\uC790\uAD00\uC774\uB2E4."],\u6587\u6E0A\u9601:["Built under Qianlong on the model of the Tianyi Pavilion in Ningbo to hold the Complete Library of the Four Treasuries. Its black glazed tiles with green edging invoke water overcoming fire, making it one of the few cool-coloured buildings in the palace.","\u4E7E\u9686\u5E74\u9593\u306B\u5BE7\u6CE2\u306E\u5929\u4E00\u95A3\u306B\u5023\u3063\u3066\u5EFA\u3066\u3089\u308C\u3001\u300E\u56DB\u5EAB\u5168\u66F8\u300F\u3092\u5C02\u8535\u3057\u305F\u3002\u9ED2\u7460\u7483\u74E6\u306B\u7DD1\u306E\u7E01\u53D6\u308A\u3067\u300C\u6C34\u306F\u706B\u306B\u514B\u3064\u300D\u3092\u8868\u3057\u3001\u5BAE\u4E2D\u3067\u306F\u73CD\u3057\u3044\u5BD2\u8272\u306E\u5EFA\u7269\u3002",'\uAC74\uB96D \uC5F0\uAC04\uC5D0 \uB2DD\uBCF4\uC758 \uCC9C\uC77C\uAC01\uC744 \uBCF8\uB5A0 \uC9C0\uC5C8\uC73C\uBA70 \u300E\uC0AC\uACE0\uC804\uC11C\u300F\uB97C \uBCF4\uAD00\uD588\uB2E4. \uAC80\uC740 \uC720\uB9AC\uAE30\uC640\uC5D0 \uCD08\uB85D \uD14C\uB450\uB9AC\uB97C \uB458\uB7EC "\uBB3C\uC774 \uBD88\uC744 \uC774\uAE34\uB2E4"\uB294 \uB73B\uC744 \uB2F4\uC558\uACE0, \uAD81 \uC548\uC5D0\uC11C \uB4DC\uBB38 \uCC28\uAC00\uC6B4 \uC0C9\uC758 \uAC74\uBB3C\uC774\uB2E4.'],\u6B66\u82F1\u6BBF:[`Symmetrical with the Hall of Literary Glory. Li Zicheng proclaimed himself emperor here; from Kangxi's reign it was the imperial office for compiling and printing books, the source of the prized "palace editions".`,"\u6587\u83EF\u6BBF\u3068\u6771\u897F\u5BFE\u79F0\u306B\u5EFA\u3064\u3002\u674E\u81EA\u6210\u304C\u3053\u3053\u3067\u5E1D\u4F4D\u306B\u5C31\u3044\u305F\u3002\u6E05\u306E\u5EB7\u7199\u5E74\u9593\u304B\u3089\u306F\u5185\u5E9C\u306E\u7DE8\u7E82\u30FB\u523B\u66F8\u306E\u5834\u3068\u306A\u308A\u3001\u300C\u6BBF\u672C\u300D\u306F\u3053\u3053\u304B\u3089\u751F\u307E\u308C\u305F\u3002",'\uBB38\uD654\uC804\uACFC \uB3D9\uC11C\uB85C \uB300\uCE6D\uC744 \uC774\uB8EC\uB2E4. \uC774\uC790\uC131\uC774 \uC774\uACF3\uC5D0\uC11C \uD669\uC81C\uB97C \uCE6D\uD588\uACE0, \uAC15\uD76C \uC5F0\uAC04\uBD80\uD130 \uB0B4\uBD80\uC758 \uD3B8\uCC2C\xB7\uC778\uC1C4 \uC7A5\uC18C\uAC00 \uB418\uC5B4 \uC774\uB978\uBC14 "\uC804\uBCF8"\uC774 \uC5EC\uAE30\uC11C \uB098\uC654\uB2E4.'],\u5357\u85B0\u6BBF:["A surviving Ming building, used in the Qing to store portraits of past emperors, empresses and sages.","\u660E\u4EE3\u306E\u907A\u69CB\u3067\u3001\u6E05\u4EE3\u306B\u306F\u6B74\u4EE3\u306E\u5E1D\u540E\u3084\u8056\u8CE2\u306E\u8096\u50CF\u753B\u3092\u53CE\u8535\u3057\u305F\u3002","\uBA85\uB098\uB77C \uB54C \uB0A8\uC740 \uAC74\uBB3C\uB85C, \uCCAD\uB098\uB77C \uB54C\uB294 \uC5ED\uB300 \uD669\uC81C\xB7\uD669\uD6C4\uC640 \uC131\uD604\uC758 \uCD08\uC0C1\uD654\uB97C \uBCF4\uAD00\uD588\uB2E4."],\u7BAD\u4EAD:["Where Qing emperors and princes practised mounted archery; it has open galleries on all four sides and no walls.","\u6E05\u4EE3\u306E\u7687\u5E1D\u3084\u7687\u5B50\u304C\u9A0E\u5C04\u3092\u7DF4\u7FD2\u3057\u305F\u5834\u3067\u3001\u56DB\u9762\u306B\u5ECA\u3092\u5DE1\u3089\u3057\u58C1\u3092\u8A2D\u3051\u306A\u3044\u3002","\uCCAD\uB098\uB77C \uD669\uC81C\uC640 \uD669\uC790\uB4E4\uC774 \uB9D0 \uD0C0\uACE0 \uD65C\uC3D8\uAE30\uB97C \uC775\uD788\uB358 \uACF3\uC73C\uB85C, \uC0AC\uBC29\uC774 \uD68C\uB791\uC774\uACE0 \uBCBD\uC774 \uC5C6\uB2E4."],\u5357\u4E09\u6240:[`Known as the "princes' lodges": three parallel courtyards, each three deep, that housed Qing princes. Their green glazed roofs stand for wood among the five elements, the element of growth.`,"\u4FD7\u306B\u300C\u963F\u54E5\u6240\u300D\u3068\u547C\u3070\u308C\u308B\u3001\u4E09\u3064\u4E26\u3093\u3060\u4E09\u9032\u9662\u843D\u3067\u3001\u6E05\u4EE3\u306E\u7687\u5B50\u306E\u4F4F\u307E\u3044\u3002\u5C4B\u6839\u306F\u7DD1\u7460\u7483\u74E6\u3067\u3001\u4E94\u884C\u306E\u6728\u306B\u5C5E\u3057\u6210\u9577\u3092\u53F8\u308B\u3002",'\uD754\uD788 "\uC544\uAC70\uC18C"\uB77C \uBD80\uB974\uB294, \uB098\uB780\uD788 \uB193\uC778 \uC138 \uCC44\uC758 \uC0BC\uC9C4 \uC6D0\uB77D\uC73C\uB85C \uCCAD\uB098\uB77C \uD669\uC790\uB4E4\uC758 \uAC70\uCC98\uC600\uB2E4. \uCD08\uB85D \uC720\uB9AC\uAE30\uC640 \uC9C0\uBD95\uC740 \uC624\uD589\uC758 \uBAA9(\u6728)\uC5D0 \uD574\uB2F9\uD574 \uC131\uC7A5\uC744 \uB73B\uD55C\uB2E4.'],\u517B\u5FC3\u6BBF:[`From Yongzheng on, eight Qing emperors lived and worked here, making it the real seat of power in the later Qing. Yongzheng's plaque "Impartial, Benevolent and Harmonious" (\u4E2D\u6B63\u4EC1\u548C) hangs in the central bay; the west chamber holds the Hall of Three Rarities; in the east chamber the empresses dowager Cixi and Ci'an "listened to government from behind the curtain".`,"\u96CD\u6B63\u5E1D\u4EE5\u964D\u3001\u6E05\u306E8\u4EBA\u306E\u7687\u5E1D\u304C\u3053\u3053\u306B\u4F4F\u307F\u65E5\u5E38\u306E\u653F\u52D9\u3092\u57F7\u308A\u3001\u6E05\u4EE3\u4E2D\u5F8C\u671F\u306E\u5B9F\u8CEA\u7684\u306A\u6A29\u529B\u306E\u4E2D\u5FC3\u3068\u306A\u3063\u305F\u3002\u660E\u9593\u306B\u96CD\u6B63\u5E1D\u7B46\u306E\u300C\u4E2D\u6B63\u4EC1\u548C\u300D\u306E\u6241\u984D\u3001\u897F\u6696\u95A3\u306B\u300C\u4E09\u5E0C\u5802\u300D\u304C\u3042\u308A\u3001\u6771\u6696\u95A3\u306F\u897F\u592A\u540E\uFF08\u6148\u79A7\uFF09\u3068\u6771\u592A\u540E\uFF08\u6148\u5B89\uFF09\u306E\u300C\u5782\u7C3E\u8074\u653F\u300D\u306E\u5834\u3002",'\uC639\uC815\uC81C \uC774\uD6C4 \uCCAD\uB098\uB77C \uD669\uC81C \uC5EC\uB35F \uBA85\uC774 \uC774\uACF3\uC5D0 \uC0B4\uBA70 \uC77C\uC0C1 \uC815\uBB34\uB97C \uBCF4\uC544, \uCCAD \uC911\xB7\uD6C4\uAE30 \uC2E4\uC9C8\uC801\uC778 \uAD8C\uB825\uC758 \uC911\uC2EC\uC774\uC5C8\uB2E4. \uAC00\uC6B4\uB370 \uCE78\uC5D0 \uC639\uC815\uC81C\uAC00 \uC4F4 "\uC911\uC815\uC778\uD654(\u4E2D\u6B63\u4EC1\u548C)" \uD604\uD310\uC774, \uC11C\uB09C\uAC01\uC5D0 "\uC0BC\uD76C\uB2F9"\uC774 \uC788\uACE0, \uB3D9\uB09C\uAC01\uC740 \uC11C\uD0DC\uD6C4\uC640 \uB3D9\uD0DC\uD6C4\uAC00 "\uC218\uB834\uCCAD\uC815"\uC744 \uD55C \uACF3\uC774\uB2E4.'],\u6C38\u5BFF\u5BAB:["One of the Six Western Palaces and the closest to the Hall of Mental Cultivation; many Ming and Qing consorts lived here.","\u897F\u516D\u5BAE\u306E\u4E00\u3064\u3067\u3001\u990A\u5FC3\u6BBF\u306B\u6700\u3082\u8FD1\u3044\u3002\u660E\u6E05\u306E\u591A\u304F\u306E\u5983\u5B2A\u304C\u4F4F\u3093\u3060\u3002","\uC11C\uC721\uAD81\uC758 \uD558\uB098\uB85C \uC591\uC2EC\uC804\uC5D0\uC11C \uAC00\uC7A5 \uAC00\uAE5D\uB2E4. \uBA85\xB7\uCCAD\uC758 \uC5EC\uB7EC \uBE44\uBE48\uC774 \uC774\uACF3\uC5D0 \uC0B4\uC558\uB2E4."],\u7FCA\u5764\u5BAB:["One of the Six Western Palaces. In the late Qing it was joined to the Palace of Gathered Elegance to form a four-courtyard compound, and Cixi received congratulations here.","\u897F\u516D\u5BAE\u306E\u4E00\u3064\u3002\u6669\u6E05\u306B\u5132\u79C0\u5BAE\u3068\u3064\u306A\u3052\u3089\u308C\u56DB\u9032\u306E\u9662\u843D\u3068\u306A\u308A\u3001\u897F\u592A\u540E\u306F\u3053\u3053\u3067\u795D\u8CC0\u3092\u53D7\u3051\u305F\u3002","\uC11C\uC721\uAD81\uC758 \uD558\uB098\uB2E4. \uCCAD \uB9D0\uC5D0 \uC800\uC218\uAD81\uACFC \uC774\uC5B4\uC838 \uC0AC\uC9C4 \uC6D0\uB77D\uC774 \uB418\uC5C8\uACE0, \uC11C\uD0DC\uD6C4\uAC00 \uC774\uACF3\uC5D0\uC11C \uD558\uB840\uB97C \uBC1B\uC558\uB2E4."],\u50A8\u79C0\u5BAB:["One of the Six Western Palaces. Cixi lived here when she first entered the palace and gave birth to the Tongzhi Emperor; for her fiftieth birthday she had it lavishly refurbished, giving it the finest interiors of the six palaces.","\u897F\u516D\u5BAE\u306E\u4E00\u3064\u3002\u897F\u592A\u540E\u306F\u5165\u5BAE\u5F53\u521D\u3053\u3053\u306B\u4F4F\u307F\u540C\u6CBB\u5E1D\u3092\u7523\u3093\u3060\u3002\u4E94\u5341\u6B73\u306E\u8A95\u751F\u65E5\u306B\u306F\u5DE8\u8CBB\u3092\u6295\u3058\u3066\u6539\u4FEE\u3057\u3001\u5185\u88C5\u306F\u516D\u5BAE\u968F\u4E00\u3068\u306A\u3063\u305F\u3002","\uC11C\uC721\uAD81\uC758 \uD558\uB098\uB2E4. \uC11C\uD0DC\uD6C4\uAC00 \uC785\uAD81 \uCD08\uAE30\uC5D0 \uC774\uACF3\uC5D0 \uC0B4\uBA70 \uB3D9\uCE58\uC81C\uB97C \uB0B3\uC558\uACE0, \uC270 \uC0B4 \uC0DD\uC77C\uC5D0 \uD070\uB3C8\uC744 \uB4E4\uC5EC \uACE0\uCCD0 \uB0B4\uBD80 \uC7A5\uC2DD\uC774 \uC721\uAD81 \uAC00\uC6B4\uB370 \uC73C\uB738\uC774 \uB418\uC5C8\uB2E4."],\u592A\u6781\u6BBF:["One of the Six Western Palaces, called the Palace of Auspicious Beginning in the Ming; in the late Qing it was connected to the Palace of Eternal Spring.","\u897F\u516D\u5BAE\u306E\u4E00\u3064\u3067\u3001\u660E\u4EE3\u306F\u5553\u7965\u5BAE\u3068\u547C\u3070\u308C\u305F\u3002\u6669\u6E05\u306B\u9577\u6625\u5BAE\u3068\u3064\u306A\u304C\u3063\u305F\u3002","\uC11C\uC721\uAD81\uC758 \uD558\uB098\uB85C \uBA85\uB098\uB77C \uB54C\uB294 \uACC4\uC0C1\uAD81\uC774\uB77C \uD588\uB2E4. \uCCAD \uB9D0\uC5D0 \uC7A5\uCD98\uAD81\uACFC \uC5F0\uACB0\uB418\uC5C8\uB2E4."],\u957F\u6625\u5BAB:["One of the Six Western Palaces. Qianlong's Empress Xiaoxian and Cixi lived here; the corridors are painted with scenes from Dream of the Red Chamber.","\u897F\u516D\u5BAE\u306E\u4E00\u3064\u3002\u4E7E\u9686\u5E1D\u306E\u5B5D\u8CE2\u7687\u540E\u3084\u897F\u592A\u540E\u304C\u4F4F\u3093\u3060\u3002\u56DE\u5ECA\u306B\u306F\u300E\u7D05\u697C\u5922\u300F\u3092\u984C\u6750\u3068\u3057\u305F\u58C1\u753B\u304C\u3042\u308B\u3002","\uC11C\uC721\uAD81\uC758 \uD558\uB098\uB2E4. \uAC74\uB96D\uC81C\uC758 \uD6A8\uD604\uD669\uD6C4\uC640 \uC11C\uD0DC\uD6C4\uAC00 \uC0B4\uC558\uC73C\uBA70, \uD68C\uB791\uC5D0 \u300E\uD64D\uB8E8\uBABD\u300F\uC744 \uC18C\uC7AC\uB85C \uD55C \uBCBD\uD654\uAC00 \uC788\uB2E4."],\u54B8\u798F\u5BAB:["One of the Six Western Palaces; its front hall has a hip roof, a higher rank than the other consorts' palaces.","\u897F\u516D\u5BAE\u306E\u4E00\u3064\u3067\u3001\u524D\u6BBF\u306F\u5EE1\u6BBF\u9802\u3001\u4ED6\u306E\u5BAE\u3088\u308A\u683C\u5F0F\u304C\u9AD8\u3044\u3002","\uC11C\uC721\uAD81\uC758 \uD558\uB098\uB85C, \uC55E \uC804\uAC01\uC774 \uC6B0\uC9C4\uAC01\uC9C0\uBD95\uC774\uB77C \uB2E4\uB978 \uAD81\uBCF4\uB2E4 \uACA9\uC774 \uB192\uB2E4."],\u666F\u4EC1\u5BAB:["One of the Six Eastern Palaces, birthplace of the Kangxi Emperor. Today it displays donated cultural relics.","\u6771\u516D\u5BAE\u306E\u4E00\u3064\u3067\u3001\u5EB7\u7199\u5E1D\u306F\u3053\u3053\u3067\u751F\u307E\u308C\u305F\u3002\u73FE\u5728\u306F\u5BC4\u8D08\u6587\u7269\u306E\u9673\u5217\u9928\u3002","\uB3D9\uC721\uAD81\uC758 \uD558\uB098\uB85C \uAC15\uD76C\uC81C\uAC00 \uC774\uACF3\uC5D0\uC11C \uD0DC\uC5B4\uB0AC\uB2E4. \uC9C0\uAE08\uC740 \uAE30\uC99D \uBB38\uBB3C \uC804\uC2DC\uAD00\uC774\uB2E4."],\u627F\u4E7E\u5BAB:["One of the Six Eastern Palaces, home of Consort Donggo, the favourite of the Shunzhi Emperor.","\u6771\u516D\u5BAE\u306E\u4E00\u3064\u3067\u3001\u9806\u6CBB\u5E1D\u306E\u5BF5\u5983\u8463\u9102\u5983\u304C\u4F4F\u3093\u3060\u3002","\uB3D9\uC721\uAD81\uC758 \uD558\uB098\uB85C \uC21C\uCE58\uC81C\uC758 \uCD1D\uBE44 \uB3D9\uC545\uBE44\uAC00 \uC0B4\uC558\uB2E4."],\u949F\u7CB9\u5BAB:["One of the Six Eastern Palaces; Empress Dowager Ci'an lived here for many years.","\u6771\u516D\u5BAE\u306E\u4E00\u3064\u3067\u3001\u6771\u592A\u540E\uFF08\u6148\u5B89\uFF09\u304C\u9577\u304F\u4F4F\u3093\u3060\u3002","\uB3D9\uC721\uAD81\uC758 \uD558\uB098\uB85C \uB3D9\uD0DC\uD6C4(\uC790\uC548)\uAC00 \uC624\uB798 \uC0B4\uC558\uB2E4."],\u5EF6\u79A7\u5BAB:['One of the Six Eastern Palaces. After repeated fires, construction began in 1909 on a Western-style "Crystal Palace" (Lingzhao Xuan), which was never finished.',"\u6771\u516D\u5BAE\u306E\u4E00\u3064\u3002\u305F\u3073\u305F\u3073\u706B\u707D\u306B\u906D\u3044\u3001\u5BA3\u7D71\u5143\u5E74\uFF081909\uFF09\u304B\u3089\u897F\u6D0B\u5F0F\u306E\u300C\u6C34\u6676\u5BAE\u300D\uFF08\u970A\u6CBC\u8ED2\uFF09\u304C\u5EFA\u3066\u3089\u308C\u305F\u304C\u672A\u5B8C\u306B\u7D42\u308F\u3063\u305F\u3002",'\uB3D9\uC721\uAD81\uC758 \uD558\uB098\uB2E4. \uC5EC\uB7EC \uCC28\uB840 \uD654\uC7AC\uB97C \uACAA\uC740 \uB4A4 1909\uB144\uBD80\uD130 \uC11C\uC591\uC2DD "\uC218\uC815\uAD81"(\uC601\uC18C\uD5CC)\uC744 \uC9D3\uAE30 \uC2DC\uC791\uD588\uC73C\uB098 \uC644\uACF5\uB418\uC9C0 \uBABB\uD588\uB2E4.'],\u6C38\u548C\u5BAB:["One of the Six Eastern Palaces; Empress Xiaogongren, mother of the Yongzheng Emperor, lived here.","\u6771\u516D\u5BAE\u306E\u4E00\u3064\u3067\u3001\u96CD\u6B63\u5E1D\u306E\u751F\u6BCD\u5B5D\u606D\u4EC1\u7687\u540E\u304C\u4F4F\u3093\u3060\u3002","\uB3D9\uC721\uAD81\uC758 \uD558\uB098\uB85C \uC639\uC815\uC81C\uC758 \uC0DD\uBAA8 \uD6A8\uACF5\uC778\uD669\uD6C4\uAC00 \uC0B4\uC558\uB2E4."],\u666F\u9633\u5BAB:["One of the Six Eastern Palaces, with a hip roof; in the Qing it was turned into a book repository.","\u6771\u516D\u5BAE\u306E\u4E00\u3064\u3067\u3001\u5EE1\u6BBF\u9802\u3002\u6E05\u4EE3\u306B\u306F\u56F3\u66F8\u306E\u53CE\u8535\u6240\u306B\u6539\u3081\u3089\u308C\u305F\u3002","\uB3D9\uC721\uAD81\uC758 \uD558\uB098\uB85C \uC6B0\uC9C4\uAC01\uC9C0\uBD95\uC774\uB2E4. \uCCAD\uB098\uB77C \uB54C \uB3C4\uC11C \uBCF4\uAD00\uC18C\uB85C \uBC14\uB00C\uC5C8\uB2E4."],\u4E7E\u4E1C\u4E94\u6240:["Five parallel courtyards north of the Six Eastern Palaces. They housed princes in the Ming and Qing and later became storehouses and the imperial painting workshop.","\u6771\u516D\u5BAE\u306E\u5317\u306B\u4E26\u3076\u4E94\u3064\u306E\u9662\u843D\u3002\u660E\u6E05\u306B\u306F\u7687\u5B50\u306E\u4F4F\u307E\u3044\u3067\u3001\u306E\u3061\u5009\u5EAB\u3084\u5982\u610F\u9928\u306A\u3069\u306B\u6539\u3081\u3089\u308C\u305F\u3002","\uB3D9\uC721\uAD81 \uBD81\uCABD\uC5D0 \uB098\uB780\uD788 \uC788\uB294 \uB2E4\uC12F \uC6D0\uB77D\uC774\uB2E4. \uBA85\xB7\uCCAD \uB54C \uD669\uC790\uC758 \uAC70\uCC98\uC600\uACE0, \uB4A4\uC5D0 \uCC3D\uACE0\uC640 \uC5EC\uC758\uAD00 \uB4F1\uC73C\uB85C \uBC14\uB00C\uC5C8\uB2E4."],"\u91CD\u534E\u5BAB \xB7 \u4E7E\u897F\u4E94\u6240":["Qianlong lived here (the second western lodge) as a prince; after his accession it was raised to the Palace of Double Glory, where he held New Year tea parties with linked-verse composition.","\u4E7E\u9686\u5E1D\u306E\u7687\u5B50\u6642\u4EE3\u306E\u4F4F\u307E\u3044\uFF08\u4E7E\u897F\u4E8C\u6240\uFF09\u3067\u3001\u5373\u4F4D\u5F8C\u306B\u91CD\u83EF\u5BAE\u3078\u683C\u4E0A\u3052\u3055\u308C\u3001\u65B0\u5E74\u306B\u306F\u3053\u3053\u3067\u8336\u5BB4\u3068\u806F\u53E5\u304C\u50AC\u3055\u308C\u305F\u3002","\uAC74\uB96D\uC81C\uAC00 \uD669\uC790 \uC2DC\uC808 \uC0B4\uB358 \uACF3(\uAC74\uC11C\uC774\uC18C)\uC73C\uB85C, \uC989\uC704 \uB4A4 \uC911\uD654\uAD81\uC73C\uB85C \uACA9\uC0C1\uB418\uC5C8\uACE0 \uC0C8\uD574\uC5D0 \uC774\uACF3\uC5D0\uC11C \uCC28 \uC5F0\uD68C\uC640 \uC5F0\uAD6C(\u806F\u53E5)\uB97C \uC5F4\uC5C8\uB2E4."],"\u658B\u5BAB|\u5185\u5EF7 \xB7 \u658B\u6212\u4E4B\u6240":["Built in 1731 under Yongzheng; the emperor fasted here before the sacrifices to Heaven and Earth.","\u96CD\u6B639\u5E74\uFF081731\uFF09\u306E\u5EFA\u7ACB\u3067\u3001\u7687\u5E1D\u306F\u5929\u5730\u3092\u7940\u308B\u524D\u306B\u3053\u3053\u3067\u658E\u6212\u3057\u305F\u3002","\uC639\uC815 9\uB144(1731)\uC5D0 \uC9C0\uC5C8\uC73C\uBA70, \uD669\uC81C\uAC00 \uCC9C\uC9C0 \uC81C\uC0AC \uC804\uC5D0 \uC774\uACF3\uC5D0\uC11C \uC7AC\uACC4\uD588\uB2E4."],\u5949\u5148\u6BBF:["The imperial family's private ancestral shrine, with front and rear halls joined by a passage. Today it is the museum's Clock Gallery.","\u660E\u6E05\u7687\u5BA4\u304C\u7956\u5148\u3092\u7940\u3063\u305F\u5BB6\u5EDF\u3067\u3001\u524D\u6BBF\u3068\u5F8C\u5BDD\u3092\u7A7F\u5802\u3067\u3064\u306A\u3050\u3002\u73FE\u5728\u306F\u6545\u5BAE\u535A\u7269\u9662\u306E\u6642\u8A08\u9928\u3002","\uBA85\xB7\uCCAD \uD669\uC2E4\uC774 \uC870\uC0C1\uC744 \uBAA8\uC2E0 \uAC00\uBB18\uB85C, \uC55E \uC804\uAC01\uACFC \uB4A4 \uCE68\uC804\uC774 \uD1B5\uB85C\uB85C \uC774\uC5B4\uC9C4\uB2E4. \uC9C0\uAE08\uC740 \uACE0\uAD81\uBC15\uBB3C\uC6D0 \uC2DC\uACC4\uAD00\uC774\uB2E4."],\u4E5D\u9F99\u58C1:["Built in 1772 under Qianlong from 270 glazed ceramic pieces forming nine coiled dragons. One piece on the belly of the third (white) dragon from the left is carved wood, said to be a craftsman's quick fix for a broken tile.","\u4E7E\u968637\u5E74\uFF081772\uFF09\u5EFA\u7ACB\u3002270\u500B\u306E\u7460\u7483\u5851\u584A\u3067\u4E5D\u5339\u306E\u87E0\u9F8D\u3092\u7D44\u3080\u3002\u5DE6\u304B\u3089\u4E09\u756A\u76EE\u306E\u767D\u9F8D\u306E\u8179\u306E\u4E00\u7247\u306F\u6728\u5F6B\u306E\u88DC\u4F5C\u3067\u3001\u8077\u4EBA\u306E\u6A5F\u8EE2\u3068\u4F1D\u3048\u3089\u308C\u308B\u3002","\uAC74\uB96D 37\uB144(1772)\uC5D0 \uC9C0\uC5C8\uC73C\uBA70 \uC720\uB9AC \uC870\uAC01 270\uAC1C\uB85C \uC544\uD649 \uB9C8\uB9AC \uBC18\uB8E1\uC744 \uC774\uB8E8\uC5C8\uB2E4. \uC67C\uCABD\uC5D0\uC11C \uC138 \uBC88\uC9F8 \uBC31\uB8E1\uC758 \uBC30 \uD55C \uC870\uAC01\uC740 \uB098\uBB34 \uC870\uAC01\uC73C\uB85C \uBA54\uC6B4 \uAC83\uC778\uB370, \uC7A5\uC778\uC758 \uAE30\uC9C0\uB77C\uACE0 \uC804\uD55C\uB2E4."],\u7687\u6781\u6BBF:["Main hall of the palace Qianlong built for his retirement as Emperor Emeritus, modelled on the Palace of Heavenly Purity. Both Qianlong and Cixi received congratulations here. Today it is part of the Treasure Gallery.","\u4E7E\u9686\u5E1D\u304C\u9000\u4F4D\u5F8C\u306E\u300C\u592A\u4E0A\u7687\u5BAE\u6BBF\u300D\u3068\u3057\u3066\u5EFA\u3066\u305F\u6B63\u6BBF\u3067\u3001\u4E7E\u6E05\u5BAE\u306E\u898F\u5236\u306B\u5023\u3046\u3002\u4E7E\u9686\u5E1D\u3082\u897F\u592A\u540E\u3082\u3053\u3053\u3067\u795D\u8CC0\u3092\u53D7\u3051\u305F\u3002\u73FE\u5728\u306F\u73CD\u5B9D\u9928\u306E\u4E00\u90E8\u3002",'\uAC74\uB96D\uC81C\uAC00 \uD1F4\uC704 \uB4A4 "\uD0DC\uC0C1\uD669 \uAD81\uC804"\uC73C\uB85C \uBBF8\uB9AC \uC9C0\uC740 \uC815\uC804\uC73C\uB85C \uAC74\uCCAD\uAD81\uC758 \uADDC\uACA9\uC744 \uB530\uB790\uB2E4. \uAC74\uB96D\uC81C\uC640 \uC11C\uD0DC\uD6C4 \uBAA8\uB450 \uC774\uACF3\uC5D0\uC11C \uD558\uB840\uB97C \uBC1B\uC558\uB2E4. \uC9C0\uAE08\uC740 \uC9C4\uBCF4\uAD00\uC758 \uC77C\uBD80\uB2E4.'],\u5B81\u5BFF\u5BAB:["Rear hall behind the Hall of Imperial Supremacy, with a single-eaved gable-and-hip roof, modelled on the Palace of Earthly Tranquility and containing a shamanic shrine.","\u7687\u6975\u6BBF\u306E\u5F8C\u6BBF\u3067\u5358\u6A90\u6B47\u5C71\u9802\u3002\u5764\u5BE7\u5BAE\u306B\u5023\u3044\u3001\u796D\u795E\u306E\u5834\u3092\u8A2D\u3051\u308B\u3002","\uD669\uADF9\uC804 \uB4A4\uC758 \uC804\uAC01\uC73C\uB85C \uD651\uCC98\uB9C8 \uD314\uC791\uC9C0\uBD95\uC774\uB2E4. \uACE4\uB155\uAD81\uC744 \uBCF8\uB5A0 \uC81C\uC0AC \uACF5\uAC04\uC744 \uB450\uC5C8\uB2E4."],\u517B\u6027\u6BBF:["Modelled on the Hall of Mental Cultivation, intended as Qianlong's residence as Emperor Emeritus.","\u990A\u5FC3\u6BBF\u306B\u5023\u3063\u3066\u5EFA\u3066\u3089\u308C\u3001\u4E7E\u9686\u5E1D\u304C\u592A\u4E0A\u7687\u306E\u5BDD\u5BAE\u3068\u3057\u3066\u4E88\u5B9A\u3057\u305F\u3002","\uC591\uC2EC\uC804\uC744 \uBCF8\uB5A0 \uC9C0\uC5C8\uC73C\uBA70 \uAC74\uB96D\uC81C\uAC00 \uD0DC\uC0C1\uD669\uC758 \uCE68\uAD81\uC73C\uB85C \uC815\uD574 \uB450\uC5C8\uB2E4."],\u4E50\u5BFF\u5802:['Modelled on the Chunhua Studio in the Garden of Eternal Spring. Cixi lived here after her sixtieth birthday. It displays the jade mountain "Yu the Great Taming the Flood", weighing over five tonnes.',"\u9577\u6625\u5712\u306E\u6DF3\u5316\u8ED2\u306B\u5023\u3046\u3002\u897F\u592A\u540E\u306F\u516D\u5341\u6B73\u306E\u8A95\u751F\u65E5\u306E\u5F8C\u3053\u3053\u306B\u4F4F\u3093\u3060\u3002\u5802\u5185\u306B\u91CD\u30555\u30C8\u30F3\u3092\u8D85\u3048\u308B\u7389\u5C71\u300C\u5927\u79B9\u6CBB\u6C34\u56F3\u300D\u304C\u3042\u308B\u3002",'\uC7A5\uCD98\uC6D0\uC758 \uC21C\uD654\uD5CC\uC744 \uBCF8\uB5B4\uB2E4. \uC11C\uD0DC\uD6C4\uAC00 \uC608\uC21C \uC0B4 \uC0DD\uC77C \uB4A4 \uC774\uACF3\uC5D0 \uC0B4\uC558\uB2E4. \uC548\uC5D0 \uBB34\uAC8C 5\uD1A4\uC774 \uB118\uB294 \uC625\uC0B0 "\uB300\uC6B0\uCE58\uC218\uB3C4"\uAC00 \uC788\uB2E4.'],\u7545\u97F3\u9601:["The largest stage in the palace, with three levels named Fortune, Prosperity and Longevity, trapdoors above and below, and machinery for operas in which immortals rose and descended. The emperor and empress watched from the Tower for Viewing Opera opposite.","\u5BAE\u4E2D\u6700\u5927\u306E\u821E\u53F0\u3067\u3001\u4E0A\u4E2D\u4E0B\u4E09\u5C64\u3092\u798F\u53F0\u30FB\u7984\u53F0\u30FB\u5BFF\u53F0\u3068\u547C\u3073\u3001\u5929\u4E95\u30FB\u5730\u4E95\u3068\u4ED5\u639B\u3051\u3092\u5099\u3048\u3001\u795E\u4ED9\u304C\u6607\u964D\u3059\u308B\u5927\u304C\u304B\u308A\u306A\u5287\u3092\u6F14\u3058\u3089\u308C\u305F\u3002\u5411\u304B\u3044\u306E\u95B2\u662F\u697C\u304C\u5E1D\u540E\u306E\u89B3\u5287\u306E\u5834\u3002","\uAD81 \uC548\uC5D0\uC11C \uAC00\uC7A5 \uD070 \uBB34\uB300\uB85C, \uC704\xB7\uAC00\uC6B4\uB370\xB7\uC544\uB798 \uC138 \uCE35\uC744 \uBCF5\uB300\xB7\uB179\uB300\xB7\uC218\uB300\uB77C \uBD80\uB978\uB2E4. \uCC9C\uC815\uACFC \uC9C0\uC815, \uC7A5\uCE58\uB97C \uAC16\uCD94\uC5B4 \uC2E0\uC120\uC774 \uC624\uB974\uB0B4\uB9AC\uB294 \uD070 \uC5F0\uADF9\uC744 \uC62C\uB9B4 \uC218 \uC788\uC5C8\uB2E4. \uB9DE\uC740\uD3B8 \uC5F4\uC2DC\uB8E8\uC5D0\uC11C \uD669\uC81C\uC640 \uD669\uD6C4\uAC00 \uAD00\uB78C\uD588\uB2E4."],\u4E7E\u9686\u82B1\u56ED:["The Ningshou Palace Garden: four courtyards unfolding one after another along a narrow strip. Before the Pavilion of Ancient Flowers is the Xishang Pavilion with its winding wine-cup channel.","\u5BE7\u5BFF\u5BAE\u82B1\u5712\u3002\u7D30\u9577\u3044\u6577\u5730\u306B\u56DB\u3064\u306E\u9662\u843D\u304C\u6BB5\u3005\u3068\u5C55\u958B\u3059\u308B\u3002\u53E4\u83EF\u8ED2\u306E\u524D\u306B\u306F\u66F2\u6C34\u6D41\u89F4\u306E\u6E9D\u3092\u523B\u3093\u3060\u798A\u8CDE\u4EAD\u304C\u3042\u308B\u3002","\uC601\uC218\uAD81 \uD654\uC6D0\uC774\uB2E4. \uC881\uACE0 \uAE34 \uB545\uC5D0 \uB124 \uC6D0\uB77D\uC774 \uCC28\uB840\uB85C \uD3BC\uCCD0\uC9C0\uBA70, \uACE0\uD654\uD5CC \uC55E\uC5D0\uB294 \uC220\uC794\uC744 \uB744\uC6B0\uB294 \uBB3C\uAE38\uC744 \uC0C8\uAE34 \uACC4\uC0C1\uC815\uC774 \uC788\uB2E4."],\u6148\u5B81\u5BAB:["Residence and reception hall of Ming and Qing empresses dowager and dowager consorts; Empress Dowager Xiaozhuang lived here for many years. Today it is the museum's Sculpture Gallery.","\u660E\u6E05\u306E\u7687\u592A\u540E\u30FB\u592A\u5983\u306E\u4F4F\u307E\u3044\u3068\u795D\u8CC0\u306E\u5834\u3067\u3001\u5B5D\u8358\u6587\u7687\u540E\u304C\u9577\u304F\u4F4F\u3093\u3060\u3002\u73FE\u5728\u306F\u6545\u5BAE\u535A\u7269\u9662\u306E\u5F6B\u5851\u9928\u3002","\uBA85\xB7\uCCAD \uD669\uD0DC\uD6C4\uC640 \uD0DC\uBE44\uC758 \uAC70\uCC98\uC774\uC790 \uD558\uB840\uB97C \uBC1B\uB358 \uACF3\uC73C\uB85C, \uD6A8\uC7A5\uBB38\uD669\uD6C4\uAC00 \uC624\uB798 \uC0B4\uC558\uB2E4. \uC9C0\uAE08\uC740 \uACE0\uAD81\uBC15\uBB3C\uC6D0 \uC870\uAC01\uAD00\uC774\uB2E4."],\u6148\u5B81\u5BAB\u82B1\u56ED:["A spacious garden where empresses dowager and dowager consorts strolled and worshipped. Its main building is Xianruo Hall, and the Pavilion over the Stream spans a pool.","\u7687\u592A\u540E\u30FB\u592A\u5983\u304C\u904A\u61A9\u30FB\u793C\u4ECF\u3057\u305F\u5EAD\u5712\u3067\u3001\u914D\u7F6E\u306F\u3086\u3063\u305F\u308A\u3068\u3057\u3001\u54B8\u82E5\u9928\u3092\u4E3B\u4F53\u306B\u81E8\u6E13\u4EAD\u304C\u6C60\u306B\u307E\u305F\u304C\u308B\u3002","\uD669\uD0DC\uD6C4\uC640 \uD0DC\uBE44\uAC00 \uAC70\uB2D0\uBA70 \uC608\uBD88\uD558\uB358 \uC815\uC6D0\uC774\uB2E4. \uBC30\uCE58\uAC00 \uB109\uB109\uD558\uACE0 \uD568\uC57D\uAD00\uC774 \uC911\uC2EC\uC774\uBA70, \uC784\uACC4\uC815\uC774 \uC5F0\uBABB \uC704\uC5D0 \uAC78\uCCD0 \uC788\uB2E4."],\u5BFF\u5EB7\u5BAB:["Built by Qianlong for his mother, Empress Dowager Chongqing; later the home of successive empresses dowager and dowager consorts.","\u4E7E\u9686\u5E1D\u304C\u751F\u6BCD\u5D07\u6176\u7687\u592A\u540E\u306E\u305F\u3081\u306B\u5EFA\u3066\u3001\u306E\u3061\u6B74\u4EE3\u306E\u7687\u592A\u540E\u30FB\u592A\u5983\u306E\u4F4F\u307E\u3044\u3068\u306A\u3063\u305F\u3002","\uAC74\uB96D\uC81C\uAC00 \uC0DD\uBAA8 \uC22D\uACBD\uD669\uD0DC\uD6C4\uB97C \uC704\uD574 \uC9C0\uC5C8\uACE0, \uB4A4\uC5D0 \uC5ED\uB300 \uD669\uD0DC\uD6C4\uC640 \uD0DC\uBE44\uC758 \uAC70\uCC98\uAC00 \uB418\uC5C8\uB2E4."],\u5BFF\u5B89\u5BAB:["Called Xianxi Palace in the Ming; Qianlong rebuilt it for his mother's birthday celebrations, including a three-tier stage.","\u660E\u4EE3\u306F\u54B8\u7199\u5BAE\u3068\u547C\u3070\u308C\u305F\u3002\u4E7E\u9686\u5E1D\u304C\u7687\u592A\u540E\u306E\u795D\u5BFF\u306E\u305F\u3081\u306B\u6539\u7BC9\u3057\u3001\u4E09\u5C64\u306E\u5927\u821E\u53F0\u3092\u8A2D\u3051\u305F\u3002","\uBA85\uB098\uB77C \uB54C \uD568\uD76C\uAD81\uC774\uB77C \uD588\uB2E4. \uAC74\uB96D\uC81C\uAC00 \uD669\uD0DC\uD6C4 \uC0DD\uC2E0 \uCD95\uD558\uB97C \uC704\uD574 \uACE0\uCCD0 \uC9D3\uACE0 3\uCE35 \uB300\uD615 \uBB34\uB300\uB97C \uB450\uC5C8\uB2E4."],\u96E8\u82B1\u9601:["Built under Qianlong on the model of the mandala hall at Tholing Monastery in Tibet, the palace's only Chinese\u2013Tibetan tantric Buddhist tower. The top storey has a gilt-bronze pyramidal roof with a gilt dragon on each of its four hip ridges.","\u4E7E\u9686\u5E74\u9593\u306B\u30C1\u30D9\u30C3\u30C8\u306E\u30C8\u30EA\u30F3\u5BFA\u306E\u58C7\u57CE\u6BBF\u306B\u5023\u3063\u3066\u5EFA\u3066\u3089\u308C\u305F\u3001\u5BAE\u4E2D\u552F\u4E00\u306E\u6F22\u8535\u6298\u8877\u306E\u5BC6\u6559\u4ECF\u697C\u3002\u6700\u4E0A\u5C64\u306F\u934D\u91D1\u9285\u74E6\u306E\u56DB\u89D2\u6522\u5C16\u9802\u3067\u3001\u56DB\u672C\u306E\u9685\u68DF\u306B\u934D\u91D1\u306E\u9285\u9F8D\u304C\u8F09\u308B\u3002","\uAC74\uB96D \uC5F0\uAC04\uC5D0 \uD2F0\uBCA0\uD2B8 \uD1A0\uB9C1 \uC0AC\uC6D0\uC758 \uB9CC\uB2E4\uB77C\uC804\uC744 \uBCF8\uB5A0 \uC9C0\uC740, \uAD81 \uC548 \uC720\uC77C\uC758 \uD55C\xB7\uD2F0\uBCA0\uD2B8 \uC808\uCDA9 \uBC00\uAD50 \uBD88\uB8E8\uB2E4. \uAF2D\uB300\uAE30 \uCE35\uC740 \uAE08\uB3C4\uAE08 \uB3D9\uAE30\uC640 \uC0AC\uBAA8 \uBAA8\uC784\uC9C0\uBD95\uC774\uBA70, \uB124 \uCD94\uB140\uB9C8\uB8E8\uB9C8\uB2E4 \uAE08\uB3C4\uAE08 \uCCAD\uB3D9 \uC6A9\uC774 \uC549\uC544 \uC788\uB2E4."],\u5EFA\u798F\u5BAB:["Built early in Qianlong's reign. The Jianfu Palace Garden (West Garden) beside it burned in 1923; its reconstruction was completed in 2005.","\u4E7E\u9686\u521D\u5E74\u306E\u5EFA\u7ACB\u3002\u897F\u5074\u306E\u5EFA\u798F\u5BAE\u82B1\u5712\uFF08\u897F\u82B1\u5712\uFF09\u306F1923\u5E74\u306B\u5927\u706B\u3067\u713C\u5931\u3057\u30012005\u5E74\u306B\u5FA9\u5143\u3055\u308C\u305F\u3002","\uAC74\uB96D \uCD08\uB144\uC5D0 \uC9C0\uC5C8\uB2E4. \uC11C\uCABD\uC758 \uAC74\uBCF5\uAD81 \uD654\uC6D0(\uC11C\uD654\uC6D0)\uC740 1923\uB144 \uD070\uBD88\uB85C \uBD88\uD0D4\uACE0, 2005\uB144\uC5D0 \uBCF5\uC6D0\uB418\uC5C8\uB2E4."],\u82F1\u534E\u6BBF:["A Ming building where empresses dowager and consorts worshipped the Buddha. In its courtyard are bodhi trees planted by Empress Dowager Li, mother of the Wanli Emperor.","\u660E\u4EE3\u306E\u5EFA\u7269\u3067\u3001\u7687\u592A\u540E\u30FB\u592A\u5983\u306E\u793C\u4ECF\u306E\u5834\u3002\u9662\u5185\u306B\u306F\u4E07\u66A6\u5E1D\u306E\u751F\u6BCD\u674E\u592A\u540E\u304C\u624B\u690D\u3048\u3057\u305F\u83E9\u63D0\u6A39\u304C\u3042\u308B\u3002","\uBA85\uB098\uB77C \uAC74\uBB3C\uB85C \uD669\uD0DC\uD6C4\uC640 \uD0DC\uBE44\uAC00 \uC608\uBD88\uD558\uB358 \uACF3\uC774\uB2E4. \uB730\uC5D0 \uB9CC\uB825\uC81C\uC758 \uC0DD\uBAA8 \uC774\uD0DC\uD6C4\uAC00 \uC190\uC218 \uC2EC\uC740 \uBCF4\uB9AC\uC218\uAC00 \uC788\uB2E4."],"\u666F\u5C71 \xB7 \u4E07\u6625\u4EAD":[`Jingshan was heaped up under Yongle from soil dug for the moat and from the demolished Yuan palace. It is the palace's "guardian hill" and northern screen. The Wanchun Pavilion on its central peak sits on the Central Axis and gives the best view over the Forbidden City.`,"\u666F\u5C71\u306F\u660E\u306E\u6C38\u697D\u5E74\u9593\u306B\u3001\u8B77\u57CE\u6CB3\u306E\u6398\u524A\u571F\u3068\u5143\u306E\u5BAE\u6BBF\u3092\u58CA\u3057\u305F\u571F\u3067\u7BC9\u304B\u308C\u3001\u7D2B\u7981\u57CE\u306E\u300C\u93AE\u5C71\u300D\u3067\u5317\u306E\u5C4F\u98A8\u3067\u3042\u308B\u3002\u4E2D\u5CF0\u306E\u4E07\u6625\u4EAD\u306F\u5317\u4EAC\u4E2D\u8EF8\u7DDA\u4E0A\u306B\u3042\u308A\u3001\u6545\u5BAE\u5168\u666F\u3092\u898B\u6E21\u3059\u6700\u826F\u306E\u5834\u6240\u3002",'\uC9D5\uC0B0\uC740 \uBA85\uB098\uB77C \uC601\uB77D \uC5F0\uAC04\uC5D0 \uD574\uC790\uB97C \uD310 \uD759\uACFC \uC6D0\uB098\uB77C \uAD81\uAD90\uC744 \uD5D0\uC5B4 \uB0B8 \uD759\uC73C\uB85C \uC313\uC740 \uC0B0\uC73C\uB85C, \uC790\uAE08\uC131\uC758 "\uC9C4\uC0B0"\uC774\uC790 \uBD81\uCABD \uBCD1\uD48D\uC774\uB2E4. \uAC00\uC6B4\uB370 \uBD09\uC6B0\uB9AC\uC758 \uB9CC\uCD98\uC815\uC740 \uBCA0\uC774\uC9D5 \uC911\uCD95\uC120 \uC704\uC5D0 \uC788\uC5B4 \uACE0\uAD81 \uC804\uACBD\uC744 \uB0B4\uB824\uB2E4\uBCF4\uAE30\uC5D0 \uAC00\uC7A5 \uC88B\uC740 \uACF3\uC774\uB2E4.'],\u5317\u6D77\u767D\u5854:['The Tibetan-style White Dagoba on Qionghua Island, built in 1651. Beihai, Zhonghai and Nanhai together form the "Three Lakes" west of the axis; shown here for context only.',"\u74CA\u83EF\u5CF6\u306E\u5C71\u9802\u306B\u7ACB\u3064\u30C1\u30D9\u30C3\u30C8\u5F0F\u306E\u767D\u5854\u3067\u3001\u6E05\u306E\u9806\u6CBB8\u5E74\uFF081651\uFF09\u5EFA\u7ACB\u3002\u5317\u6D77\u30FB\u4E2D\u6D77\u30FB\u5357\u6D77\u3092\u5408\u308F\u305B\u3066\u300C\u4E09\u6D77\u300D\u3068\u547C\u3073\u3001\u4E2D\u8EF8\u7DDA\u306E\u897F\u5074\u306B\u4F4D\u7F6E\u3059\u308B\u3002\u3053\u3053\u3067\u306F\u74B0\u5883\u306E\u53C2\u8003\u8868\u793A\u306B\u3068\u3069\u307E\u308B\u3002",'\uACBD\uD654\uB3C4 \uC0B0\uAF2D\uB300\uAE30\uC758 \uD2F0\uBCA0\uD2B8\uC2DD \uBC31\uD0D1\uC73C\uB85C 1651\uB144\uC5D0 \uC138\uC6E0\uB2E4. \uBCA0\uC774\uD558\uC774\xB7\uC911\uD558\uC774\xB7\uB09C\uD558\uC774\uB97C \uD569\uCCD0 "\uC0BC\uD574"\uB77C \uD558\uBA70 \uC911\uCD95\uC120 \uC11C\uCABD\uC5D0 \uC788\uB2E4. \uC5EC\uAE30\uC11C\uB294 \uC8FC\uBCC0 \uD658\uACBD \uD45C\uC2DC\uB85C\uB9CC \uB123\uC5C8\uB2E4.'],\u6C38\u5B9A\u95E8:["Main south gate of Beijing's Outer City and the southern end point of the Central Axis. Begun in 1553, it was the highest-ranking of the Outer City's seven gates. Demolished in 1957, its gate tower was rebuilt on the original site in 2004 from historical records; the barbican is marked on the ground.","\u5317\u4EAC\u5916\u57CE\u306E\u6B63\u5357\u9580\u3067\u3001\u4E2D\u8EF8\u7DDA\u306E\u5357\u306E\u7AEF\u70B9\u3002\u660E\u306E\u5609\u975632\u5E74\uFF081553\uFF09\u306B\u5275\u5EFA\u3055\u308C\u3001\u5916\u57CE\u4E03\u9580\u306E\u3046\u3061\u6700\u3082\u683C\u5F0F\u304C\u9AD8\u3044\u30021957\u5E74\u306B\u64A4\u53BB\u3055\u308C\u30012004\u5E74\u306B\u53F2\u6599\u306B\u57FA\u3065\u304D\u539F\u4F4D\u7F6E\u306B\u57CE\u697C\u304C\u518D\u5EFA\u3055\u308C\u305F\u3002\u7515\u57CE\u306F\u5730\u9762\u306E\u8868\u793A\u3067\u793A\u3055\u308C\u3066\u3044\u308B\u3002","\uBCA0\uC774\uC9D5 \uC678\uC131\uC758 \uC815\uB0A8\uBB38\uC774\uC790 \uC911\uCD95\uC120\uC758 \uB0A8\uCABD \uB05D\uC810\uC774\uB2E4. 1553\uB144\uC5D0 \uCC98\uC74C \uC9C0\uC5C8\uC73C\uBA70 \uC678\uC131 \uC77C\uACF1 \uBB38 \uAC00\uC6B4\uB370 \uACA9\uC774 \uAC00\uC7A5 \uB192\uC558\uB2E4. 1957\uB144\uC5D0 \uCCA0\uAC70\uB418\uC5C8\uB2E4\uAC00 2004\uB144 \uC0AC\uB8CC\uC5D0 \uB530\uB77C \uC6D0\uB798 \uC790\uB9AC\uC5D0 \uC131\uB8E8\uB97C \uBCF5\uC6D0\uD588\uACE0, \uC639\uC131\uC740 \uBC14\uB2E5 \uD45C\uC2DC\uB85C \uBCF4\uC5EC \uC900\uB2E4."],\u7948\u5E74\u6BBF:["Where Ming and Qing emperors prayed for good harvests each spring: a round hall with three tiers of eaves, blue tiles symbolising the sky and a gilded finial. It has no long beams or purlins and stands on 28 nanmu columns: the four central Dragon Well columns for the four seasons, an inner ring of twelve for the months and an outer ring of twelve for the two-hour periods of the day. The present hall was rebuilt to the original design after lightning burned it in the Guangxu reign.","\u660E\u6E05\u306E\u7687\u5E1D\u304C\u5B5F\u6625\u306B\u8C4A\u4F5C\u3092\u7948\u3063\u305F\u5834\u6240\u3002\u4E09\u91CD\u6A90\u306E\u5186\u5F62\u6522\u5C16\u9802\u3067\u3001\u9752\u74E6\u306F\u5929\u3092\u8868\u3057\u3001\u9802\u306B\u934D\u91D1\u306E\u5B9D\u9802\u3092\u8F09\u305B\u308B\u3002\u5927\u6881\u3084\u9577\u3044\u6841\u3092\u7528\u3044\u305A28\u672C\u306E\u6960\u6728\u306E\u67F1\u3067\u652F\u3048\u3001\u4E2D\u592E\u306E\u9F8D\u4E95\u67F14\u672C\u306F\u56DB\u5B63\u3001\u4E2D\u74B0\u306E\u91D1\u67F112\u672C\u306F\u5341\u4E8C\u304B\u6708\u3001\u5916\u74B0\u306E\u6A90\u67F112\u672C\u306F\u5341\u4E8C\u6642\u8FB0\u3092\u8868\u3059\u3002\u73FE\u5B58\u306E\u6BBF\u306F\u5149\u7DD2\u5E74\u9593\u306B\u843D\u96F7\u3067\u713C\u5931\u3057\u305F\u5F8C\u3001\u539F\u72B6\u3069\u304A\u308A\u518D\u5EFA\u3055\u308C\u305F\u3002","\uBA85\xB7\uCCAD \uD669\uC81C\uAC00 \uC774\uB978 \uBD04 \uD48D\uB144\uC744 \uBE4C\uB358 \uACF3\uC774\uB2E4. \uC138 \uACB9 \uCC98\uB9C8\uC758 \uB465\uADFC \uBAA8\uC784\uC9C0\uBD95\uC5D0 \uD478\uB978 \uAE30\uC640\uB294 \uD558\uB298\uC744 \uC0C1\uC9D5\uD558\uACE0 \uAF2D\uB300\uAE30\uC5D0 \uAE08\uB3C4\uAE08 \uBCF4\uC815\uC744 \uC5B9\uC5C8\uB2E4. \uD070 \uB4E4\uBCF4\uB098 \uAE34 \uB3C4\uB9AC \uC5C6\uC774 \uB179\uB098\uBB34 \uAE30\uB465 28\uAC1C\uB85C \uB5A0\uBC1B\uCE58\uB294\uB370, \uAC00\uC6B4\uB370 \uC6A9\uC815\uC8FC 4\uAC1C\uB294 \uC0AC\uACC4\uC808, \uC548\uCABD 12\uAC1C \uAE08\uC8FC\uB294 \uC5F4\uB450 \uB2EC, \uBC14\uAE65 12\uAC1C \uCCA8\uC8FC\uB294 \uD558\uB8E8 \uC5F4\uB450 \uC2DC\uC9C4\uC744 \uB73B\uD55C\uB2E4. \uC9C0\uAE08 \uAC74\uBB3C\uC740 \uAD11\uC11C \uC5F0\uAC04 \uBCBC\uB77D\uC73C\uB85C \uBD88\uD0C4 \uB4A4 \uC6D0\uB798\uB300\uB85C \uB2E4\uC2DC \uC9C0\uC740 \uAC83\uC774\uB2E4."],\u7687\u4E7E\u6BBF:["The tablet hall north of the Hall of Prayer for Good Harvests, which normally housed the tablets of the Supreme Lord of Heaven and the imperial ancestors.","\u7948\u5E74\u6BBF\u306E\u5317\u306B\u3042\u308B\u795E\u5EAB\u3067\u3001\u5E73\u6642\u306F\u300C\u7687\u5929\u4E0A\u5E1D\u300D\u3068\u7687\u5E1D\u306E\u7956\u5148\u306E\u795E\u4F4D\u3092\u7940\u3063\u305F\u3002",'\uAE30\uB144\uC804 \uBD81\uCABD\uC758 \uC2E0\uACE0\uB85C, \uD3C9\uC18C "\uD669\uCC9C\uC0C1\uC81C"\uC640 \uD669\uC81C \uC870\uC0C1\uC758 \uC2E0\uC704\uB97C \uBAA8\uC168\uB2E4.'],\u4E39\u965B\u6865:["The raised brick causeway linking the Circular Mound and the Altar of Prayer for Grain, also called the Haiman Avenue. It rises gradually from south to north, symbolising an ascent step by step towards heaven.","\u571C\u4E18\u58C7\u3068\u7948\u7A40\u58C7\u3092\u7D50\u3076\u7149\u74E6\u7A4D\u307F\u306E\u9AD8\u3044\u752C\u9053\u3067\u3001\u6D77\u5881\u5927\u9053\u3068\u3082\u547C\u3076\u3002\u5357\u304B\u3089\u5317\u3078\u5F90\u3005\u306B\u9AD8\u304F\u306A\u308A\u3001\u4E00\u6B69\u305A\u3064\u5929\u306B\u6607\u308B\u3053\u3068\u3092\u8868\u3059\u3002","\uD658\uAD6C\uB2E8\uACFC \uAE30\uACE1\uB2E8\uC744 \uC787\uB294 \uBCBD\uB3CC\uB85C \uC313\uC740 \uB192\uC740 \uAE38\uB85C \uD574\uB9CC\uB300\uB3C4\uB77C\uACE0\uB3C4 \uD55C\uB2E4. \uB0A8\uCABD\uC5D0\uC11C \uBD81\uCABD\uC73C\uB85C \uC810\uC810 \uB192\uC544\uC838 \uD55C \uAC78\uC74C\uC529 \uD558\uB298\uC5D0 \uC624\uB984\uC744 \uB73B\uD55C\uB2E4."],"\u7687\u7A79\u5B87 \xB7 \u56DE\u97F3\u58C1":["The round hall that kept the spirit tablets used at the Circular Mound, with a single-eaved conical roof of blue tiles and a gold finial. The circular wall around it is the Echo Wall, whose finely ground bricks carry a whisper along the curve.","\u571C\u4E18\u306E\u796D\u5929\u306E\u795E\u4F4D\u3092\u7D0D\u3081\u308B\u5186\u6BBF\u3067\u3001\u5358\u6A90\u6522\u5C16\u3001\u9752\u74E6\u91D1\u9802\u3002\u5468\u56F2\u3092\u5DE1\u308B\u5186\u5F62\u306E\u56F2\u58C1\u304C\u56DE\u97F3\u58C1\u3067\u3001\u78E8\u304D\u4E0A\u3052\u305F\u7149\u74E6\u306E\u58C1\u9762\u304C\u5F27\u306B\u6CBF\u3063\u3066\u97F3\u3092\u4F1D\u3048\u308B\u3002","\uD658\uAD6C\uB2E8 \uC81C\uCC9C \uC2E0\uC704\uB97C \uBCF4\uAD00\uD558\uB294 \uB465\uADFC \uC804\uAC01\uC73C\uB85C \uD651\uCC98\uB9C8 \uBAA8\uC784\uC9C0\uBD95\uC5D0 \uD478\uB978 \uAE30\uC640, \uAE08\uBE5B \uBCF4\uC815\uC744 \uC5B9\uC5C8\uB2E4. \uB458\uB808\uC758 \uB465\uADFC \uB2F4\uC7A5\uC774 \uD68C\uC74C\uBCBD\uC73C\uB85C, \uB9E4\uB048\uD558\uAC8C \uAC04 \uBCBD\uB3CC \uBA74\uC774 \uACE1\uC120\uC744 \uB530\uB77C \uC18C\uB9AC\uB97C \uC804\uD55C\uB2E4."],\u571C\u4E18:['Built in 1530 and enlarged under Qianlong, the open-air round altar where the emperor sacrificed to Heaven at the Winter Solstice. The paving stones, balusters and steps all come in nines or multiples of nine; the square outer and round inner low walls stand for "round heaven, square earth".',"\u660E\u306E\u5609\u97569\u5E74\uFF081530\uFF09\u5EFA\u7ACB\u3001\u6E05\u306E\u4E7E\u9686\u5E74\u9593\u306B\u62E1\u5F35\u3055\u308C\u305F\u3001\u7687\u5E1D\u304C\u51AC\u81F3\u306B\u5929\u3092\u7940\u308B\u9732\u5929\u306E\u5186\u58C7\u3002\u6577\u77F3\u30FB\u6B04\u677F\u30FB\u968E\u6BB5\u306E\u6570\u306F\u3059\u3079\u3066\u4E5D\u307E\u305F\u306F\u4E5D\u306E\u500D\u6570\u3002\u5916\u304C\u65B9\u5F62\u3001\u5185\u304C\u5186\u5F62\u306E\u4E8C\u91CD\u306E\u4F4E\u3044\u58C1\u306F\u300C\u5929\u5186\u5730\u65B9\u300D\u3092\u8868\u3059\u3002",'1530\uB144\uC5D0 \uC9D3\uACE0 \uAC74\uB96D \uC5F0\uAC04\uC5D0 \uB113\uD78C, \uD669\uC81C\uAC00 \uB3D9\uC9C0\uC5D0 \uD558\uB298\uC5D0 \uC81C\uC0AC \uC9C0\uB0B4\uB358 \uC57C\uC678 \uC6D0\uD615 \uC81C\uB2E8\uC774\uB2E4. \uBC14\uB2E5\uB3CC\xB7\uB09C\uAC04\xB7\uACC4\uB2E8 \uC218\uAC00 \uBAA8\uB450 9 \uB610\uB294 9\uC758 \uBC30\uC218\uC774\uBA70, \uBC14\uAE65\uC740 \uB124\uBAA8\uB098\uACE0 \uC548\uC740 \uB465\uADFC \uB450 \uACB9 \uB0AE\uC740 \uB2F4\uC740 "\uD558\uB298\uC740 \uB465\uAE00\uACE0 \uB545\uC740 \uB124\uBAA8\uB0A8"\uC744 \uB73B\uD55C\uB2E4.'],"\u658B\u5BAB|\u5929\u575B \xB7 \u658B\u6212\u4E4B\u6240":[`The "little palace" where the emperor fasted before sacrificing to Heaven. It faces east and has green tiles, showing the emperor's humility before Heaven. The main hall is a brick-vaulted beamless hall, surrounded by two imperial moats.`,"\u7687\u5E1D\u304C\u796D\u5929\u306E\u524D\u306B\u658E\u6212\u3057\u305F\u300C\u5C0F\u7687\u5BAE\u300D\u3002\u897F\u306B\u5EA7\u3057\u3066\u6771\u3092\u5411\u304D\u3001\u7DD1\u7460\u7483\u74E6\u3092\u7528\u3044\u3066\u5929\u5E1D\u306B\u81E3\u5F93\u3059\u308B\u610F\u3092\u793A\u3059\u3002\u6B63\u6BBF\u306F\u7149\u74E6\u9020\u30A2\u30FC\u30C1\u306E\u7121\u6881\u6BBF\u3067\u3001\u5916\u5074\u3092\u4E8C\u91CD\u306E\u5FA1\u6E9D\u304C\u5DE1\u308B\u3002",'\uD669\uC81C\uAC00 \uC81C\uCC9C \uC804\uC5D0 \uC7AC\uACC4\uD558\uB358 "\uC791\uC740 \uD669\uAD81"\uC774\uB2E4. \uC11C\uCABD\uC5D0 \uC549\uC544 \uB3D9\uCABD\uC744 \uD5A5\uD558\uACE0, \uCD08\uB85D \uC720\uB9AC\uAE30\uC640\uB85C \uD558\uB298 \uC55E\uC5D0 \uC2E0\uD558\uC784\uC744 \uB098\uD0C0\uB0C8\uB2E4. \uC815\uC804\uC740 \uBCBD\uB3CC \uC544\uCE58\uB85C \uC9C0\uC740 \uBB34\uB7C9\uC804\uC774\uBA70 \uBC14\uAE65\uC744 \uB450 \uACB9 \uC5B4\uAD6C\uAC00 \uB458\uB7EC\uC2FC\uB2E4.'],\u795E\u4E50\u7F72:["Where the ritual music and dances for the Ming and Qing state sacrifices were rehearsed.","\u660E\u6E05\u306E\u796D\u7940\u306E\u793C\u697D\u3092\u6F14\u7FD2\u3057\u305F\u5834\u6240\u3002","\uBA85\xB7\uCCAD \uAD6D\uAC00 \uC81C\uC0AC\uC758 \uC608\uC545\uC744 \uC5F0\uC2B5\uD558\uB358 \uACF3\uC774\uB2E4."],\u5929\u575B:["Where Ming and Qing emperors sacrificed to Heaven and prayed for harvests, begun in 1420. The main axis inside sits east of centre; from south to north it runs from the Circular Mound and the Imperial Vault of Heaven over Danbi Bridge to the Hall of Prayer for Good Harvests, among groves of old cypresses. It faces the Altar of Agriculture across the Central Axis.","\u660E\u6E05\u306E\u7687\u5E1D\u304C\u5929\u3092\u7940\u308A\u8C4A\u4F5C\u3092\u7948\u3063\u305F\u5834\u6240\u3067\u3001\u660E\u306E\u6C38\u697D18\u5E74\uFF081420\uFF09\u306B\u5275\u5EFA\u3002\u58C7\u5185\u306E\u4E3B\u8EF8\u306F\u6771\u5BC4\u308A\u3067\u3001\u5357\u304B\u3089\u5317\u3078\u571C\u4E18\u3001\u7687\u7A79\u5B87\u3001\u4E39\u965B\u6A4B\u3001\u7948\u5E74\u6BBF\u304C\u4E26\u3073\u3001\u5468\u56F2\u306B\u53E4\u3044\u67CF\u304C\u8302\u308B\u3002\u4E2D\u8EF8\u7DDA\u3092\u631F\u3093\u3067\u897F\u306E\u5148\u8FB2\u58C7\u3068\u5411\u304D\u5408\u3046\u3002","\uBA85\xB7\uCCAD \uD669\uC81C\uAC00 \uD558\uB298\uC5D0 \uC81C\uC0AC \uC9C0\uB0B4\uACE0 \uD48D\uB144\uC744 \uBE4C\uB358 \uACF3\uC73C\uB85C 1420\uB144\uC5D0 \uCC98\uC74C \uC9C0\uC5C8\uB2E4. \uB2E8 \uC548\uC758 \uC8FC\uCD95\uC740 \uB3D9\uCABD\uC73C\uB85C \uCE58\uC6B0\uCCD0 \uC788\uC73C\uBA70, \uB0A8\uCABD\uC5D0\uC11C \uBD81\uCABD\uC73C\uB85C \uD658\uAD6C\uB2E8, \uD669\uAD81\uC6B0, \uB2E8\uD3D0\uAD50, \uAE30\uB144\uC804\uC774 \uC774\uC5B4\uC9C0\uACE0 \uB458\uB808\uC5D0 \uC624\uB798\uB41C \uCE21\uBC31\uB098\uBB34\uAC00 \uC6B0\uAC70\uC84C\uB2E4. \uC911\uCD95\uC120\uC744 \uC0AC\uC774\uC5D0 \uB450\uACE0 \uC11C\uCABD\uC758 \uC120\uB18D\uB2E8\uACFC \uB9C8\uC8FC\uD55C\uB2E4."],\u592A\u5C81\u6BBF:["The great hall for sacrifices to Taisui (the Jupiter deity) and the generals of the twelve months, a fine example of Ming official architecture. Today it is the main gallery of the Beijing Ancient Architecture Museum.","\u592A\u6B73\u3068\u5341\u4E8C\u304B\u6708\u306E\u6708\u5C06\u795E\u3092\u7940\u308B\u5927\u6BBF\u3067\u3001\u660E\u4EE3\u5B98\u5F0F\u5EFA\u7BC9\u306E\u4EE3\u8868\u3002\u73FE\u5728\u306F\u5317\u4EAC\u53E4\u4EE3\u5EFA\u7BC9\u535A\u7269\u9928\u306E\u4E3B\u5C55\u793A\u5BA4\u3002","\uD0DC\uC138\uC640 \uC5F4\uB450 \uB2EC\uC758 \uC6D4\uC7A5\uC2E0\uC744 \uBAA8\uC2E0 \uD070 \uC804\uAC01\uC73C\uB85C \uBA85\uB098\uB77C \uAD00\uC2DD \uAC74\uCD95\uC758 \uB300\uD45C\uC791\uC774\uB2E4. \uC9C0\uAE08\uC740 \uBCA0\uC774\uC9D5 \uACE0\uB300\uAC74\uCD95\uBC15\uBB3C\uAD00\uC758 \uC8FC \uC804\uC2DC\uC2E4\uC774\uB2E4."],\u5148\u519C\u795E\u575B:["A single-tier square altar of brick and stone where the emperor sacrificed to Shennong, the god of agriculture.","\u7149\u74E6\u3068\u77F3\u3067\u7BC9\u3044\u305F\u4E00\u5C64\u306E\u65B9\u58C7\u3067\u3001\u7687\u5E1D\u306F\u3053\u3053\u3067\u5148\u8FB2\u795E\uFF08\u795E\u8FB2\u6C0F\uFF09\u3092\u7940\u3063\u305F\u3002","\uBCBD\uB3CC\uACFC \uB3CC\uB85C \uC313\uC740 \uB2E8\uCE35 \uB124\uBAA8 \uC81C\uB2E8\uC73C\uB85C, \uD669\uC81C\uAC00 \uC774\uACF3\uC5D0\uC11C \uC120\uB18D\uC2E0(\uC2E0\uB18D\uC528)\uC5D0\uAC8C \uC81C\uC0AC \uC9C0\uB0C8\uB2E4."],\u795E\u4ED3:["The courtyard that stored grain from the emperor's own field; the round granary in the centre supplied the capital's altars and temples for their sacrifices.","\u7687\u5E1D\u306E\u89AA\u8015\u306B\u3088\u308B\u7C4D\u7530\u306E\u53CE\u7A6B\u3092\u8CAF\u3048\u305F\u9662\u843D\u3067\u3001\u4E2D\u592E\u306B\u5186\u5F62\u306E\u5009\u304C\u3042\u308B\u3002\u84C4\u3048\u306F\u90FD\u306E\u5404\u58C7\u5EDF\u306E\u796D\u7940
